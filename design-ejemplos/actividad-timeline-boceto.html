<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La línea del tiempo · Feminist</title>
<!-- BOCETO de la actividad «La línea del tiempo» (paso 4).
     Cada ronda trae DOS cartas relacionadas (pregunta sin año; la explicación llega al terminar la pareja) (data/timeline.json, «parejas»). Lo que se arrastra es el PUNTERO de cada carta: se suelta donde se cree que va,
     se corrige solo hasta su año real y se queda en la línea, pequeño; al pasar el ratón (o tocarlo) se amplía para leerlo.
     Camino sinuoso vertical en móvil y serpiente de 4 filas en escritorio, de 1750 a hoy, con las islas-hito fijas. Datos de PRUEBA. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #101010; --blanco: #F5F5F0; --morado: #6B2D8C; --oro: #C9A24B; --oro-claro: #E8CE86; --rosa: #C2386E; --plata: #b9b1c9;
    --fondo: #101010; --panel: #17121f; --suave: #b9b1c9;
    --fuente-titulos: "Cinzel Decorative", Georgia, serif; --fuente-nombres: "Cinzel", Georgia, serif;
    --fuente-texto: "Atkinson Hyperlegible Next", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column; background: var(--fondo); color: var(--blanco); font-family: var(--fuente-texto); font-size: 1rem; line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--oro-claro); outline-offset: 3px; }
  a { color: var(--oro-claro); }
  .envoltorio { width: min(1040px, 100% - 32px); margin-inline: auto; }
  header.cab { position: relative; padding: 18px 0 4px; }
  header.cab .envoltorio { position: relative; }
  .logo { display: block; width: fit-content; font-family: var(--fuente-titulos); font-weight: 700; font-size: 1.4rem; color: var(--blanco); text-decoration: none; }
  h1 { display: inline-block; margin: 22px 0 8px; padding: .25em .7em; background: var(--morado); color: var(--blanco); transform: rotate(-1.2deg); box-shadow: 5px 5px 0 var(--blanco);
    font-family: var(--fuente-titulos); font-weight: 700; font-size: clamp(1.4rem, 5vw, 2.2rem); line-height: 1.25; }
  .sub { max-width: 62ch; color: #e6e0f0; margin: 6px 0 0; }
  .aviso-boceto { margin: 14px 0 0; padding: 8px 12px; border-left: 4px solid var(--oro); background: rgba(201, 162, 75, .08); border-radius: 0 10px 10px 0; color: var(--oro-claro); font-size: .9rem; }
  main { position: relative; z-index: 1; padding-bottom: 0; }

  /* botones: las pastillas rayadas de la UI del videojuego */
  .btn { font: inherit; font-family: var(--fuente-nombres); font-weight: 700; letter-spacing: .04em; cursor: pointer; min-height: 64px; min-width: 130px; padding: 0 6px; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .7);
    border: 20px solid transparent; border-width: 20px 24px; background: none; border-image: url("img/opt/boton-verde.webp") 30% 26% fill / 20px 24px stretch; transition: filter .15s, transform .1s; }
  .btn:hover { filter: brightness(1.15); }
  .btn:active:not(:disabled) { transform: translateY(2px) scale(.97); filter: brightness(.85); }
  .btn:disabled { filter: grayscale(.85) brightness(.65); cursor: default; }
  .btn.primario { color: #2b1805; text-shadow: 0 1px 0 rgba(255, 255, 255, .35); border-image-source: url("img/opt/boton-naranja.webp"); }

  /* ---------- La línea del tiempo ---------- */
  .linea { position: relative; width: min(1040px, 100% - 32px); margin: 18px auto 0; touch-action: pan-y; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  .camino, .conectores { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .camino .via { fill: none; stroke: rgba(185, 177, 201, .55); stroke-width: 4; stroke-linecap: round; }
  .camino .via-luz { fill: none; stroke: rgba(232, 206, 134, .35); stroke-width: 1.5; stroke-linecap: round; }
  .camino .tramo { fill: none; stroke-width: 6; stroke-linecap: round; opacity: .95; }
  .conectores path { fill: none; stroke-width: 1.5; stroke-linejoin: round; opacity: .75; }
  .marca { position: absolute; transform: translate(-50%, -50%); padding: 1px 9px; border-radius: 99px; background: var(--panel); border: 1px solid rgba(185, 177, 201, .5); font-family: var(--fuente-nombres); font-weight: 700; font-size: .78rem; color: var(--blanco); pointer-events: none; white-space: nowrap; }
  .marca.siglo { border-color: var(--oro); color: var(--oro-claro); font-size: .9rem; padding: 2px 11px; }
  .isla { position: absolute; margin: 0; padding: 0; background: none; border: 0; color: inherit; font: inherit; text-align: center; cursor: pointer; }
  .isla img { display: block; width: 100%; height: auto; animation: flota 7s ease-in-out infinite; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .55)); }
  .isla:nth-of-type(even) img { animation-delay: -3s; }
  .isla .nombre { display: block; margin-top: 2px; font-family: var(--fuente-nombres); font-weight: 700; font-size: .84rem; line-height: 1.2; color: var(--oro-claro); text-shadow: 0 1px 3px #000; }
  .isla .anios { display: block; font-size: .8rem; color: var(--blanco); text-shadow: 0 1px 3px #000; }
  .isla { transition: transform .25s ease; transform-origin: 50% 100%; } .isla:hover, .isla:focus-visible { transform: scale(1.55); z-index: 9; }
  .isla:hover .nombre, .isla:focus-visible .nombre { color: #fff; }
  @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  /* línea guía que se coloca al tocar */
  .guia { position: absolute; pointer-events: none; z-index: 4; box-shadow: 0 0 10px rgba(232, 206, 134, .6); }
  .guia.hor { left: 0; right: 0; height: 0; border-top: 2px solid var(--oro-claro); }
  .guia.ver { width: 0; border-left: 2px solid var(--oro-claro); }
  .guia[hidden] { display: none; }
  .guia .anio { position: absolute; top: -17px; transform: translateX(-50%); min-width: 72px; padding: 2px 10px; text-align: center; border-radius: 99px; background: var(--oro); color: #2b1805; font-family: var(--fuente-nombres); font-weight: 700; font-size: .95rem; }

  /* ---------- Bandeja con las dos cartas ---------- */
  .bandeja { position: sticky; bottom: 0; z-index: 20; margin-top: 18px; padding: 12px 0 14px; max-height: 62vh; overflow-y: auto; background: linear-gradient(180deg, rgba(23, 18, 31, .97), #0c0912); border-top: 2px solid rgba(185, 177, 201, .45); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 24px rgba(0, 0, 0, .55); }
  .bandeja .ronda { margin: 0 0 8px; font-family: var(--fuente-nombres); font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--oro-claro); }
  .cartas { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; padding: 8px; }
  /* cada carta: marco de plata fino con las esquineras de rosas de Mireia, como las cajas de las otras actividades */
  .carta { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; padding: 8px 10px 8px 8px; cursor: pointer; border: 1px solid rgba(185, 177, 201, .5); border-radius: 14px; background: rgba(245, 245, 240, .05); }
  .carta::before { content: ""; position: absolute; inset: -7px; pointer-events: none; z-index: 2; --esq: clamp(30px, 8vw, 40px);
    background: url("img/opt/esquina-rosas-tl.webp") left top / var(--esq) auto no-repeat, url("img/opt/esquina-rosas-tr.webp") right top / var(--esq) auto no-repeat,
                url("img/opt/esquina-rosas-bl.webp") left bottom / var(--esq) auto no-repeat, url("img/opt/esquina-rosas-br.webp") right bottom / var(--esq) auto no-repeat;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .6)); }
  .carta.sel { border-color: var(--oro-claro); box-shadow: 0 0 14px rgba(232, 206, 134, .25); }
  .carta .txt p { margin: 0 0 6px; font-size: .86rem; line-height: 1.34; }
  .carta .txt .pregunta { font-family: var(--fuente-nombres); font-weight: 700; font-size: 1.12rem; color: var(--oro-claro); line-height: 1.3; }
  .carta .txt .res { color: var(--oro-claro); font-weight: 700; }
  .carta .txt h3 { margin: 0 0 4px; font-family: var(--fuente-nombres); font-size: 1.05rem; line-height: 1.25; color: var(--oro-claro); }
  .cartas.expl .txt p { font-size: 1rem; line-height: 1.42; }
  /* móvil: antes de explicar solo se ven los dos punteros grandes; la pregunta de la carta elegida va debajo */
  .cartas:not(.expl) .txt { display: none; }
  .cartas:not(.expl) .carta { grid-template-columns: 1fr; justify-items: center; padding: 8px 6px; }
  .cartas.expl { grid-template-columns: 1fr; } .cartas.expl .pin-b { display: none; } .cartas.expl .carta { grid-template-columns: 1fr; cursor: default; }
  .texto-sel { margin: 4px 8px 0; padding: 8px 12px; border-left: 3px solid var(--oro); font-family: var(--fuente-nombres); font-weight: 700; font-size: 1.08rem; line-height: 1.3; color: var(--oro-claro); }
  .texto-sel p { margin: 0; }
  .bandeja .ayuda { margin: 8px 0 0; font-size: .85rem; color: var(--suave); }
  .bandeja .comp { margin: 8px 0 0; font-family: var(--fuente-nombres); font-weight: 700; color: var(--oro-claro); }
  .bandeja .comp:empty { display: none; }
  .bandeja #acc { margin-top: 6px; } .bandeja #acc .btn { min-height: 56px; }
  .bandeja .final { margin: 4px 6px; font-size: 1rem; }
  /* móvil: al terminar de colocar solo queda el comentario y el botón; en la explicación el botón va arriba y las cartas se leen debajo */
  @media (max-width: 899px) {
    .bandeja .envoltorio { display: flex; flex-direction: column; }
    body[data-fase="listo"] .cartas, body[data-fase="listo"] .texto-sel, body[data-fase="explicado"] .ronda { display: none; }
    body[data-fase="explicado"] .zona-acc { order: -1; margin-bottom: 8px; }
    .bandeja .comp { font-size: .95rem; }
  }
  .btn.brilla { animation: brilla 1.4s ease-in-out infinite; }
  @keyframes brilla { 0%, 100% { filter: brightness(1) drop-shadow(0 0 0 rgba(255, 200, 90, 0)); } 50% { filter: brightness(1.25) drop-shadow(0 0 14px rgba(255, 200, 90, .95)); } }
  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- Los punteros (de Mireia) ----------
     · en la bandeja y en la línea: el modelo liso con la frase dentro; al pasar el ratón se agrandan para leerla.
     · al pulsar uno colocado, gira y enseña el año por detrás (modelo de relieve) y después vuelve a mostrar la frase. */
  .pin-centro { position: absolute; left: 50%; top: 33%; transform: translate(-50%, -50%); width: 72%; text-align: center; pointer-events: none; color: var(--oro-claro); text-shadow: 0 1px 2px #000, 0 0 6px rgba(0, 0, 0, .85); }
  .pin-centro.frase { font-family: var(--fuente-texto); font-weight: 700; text-transform: uppercase; font-size: calc(var(--pw) * .12); line-height: 1.1; }
  .pin-centro.anio.largo { font-size: calc(var(--pw) * .15); width: 84%; }
  .pin-centro.anio { font-family: var(--fuente-nombres); font-weight: 700; font-size: calc(var(--pw) * .25); line-height: 1; width: 80%; }
  .pin-b { --pw: 84px; position: relative; display: block; width: var(--pw); padding: 0; border: 0; background: none; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
  .pin-b { animation: oscila 3.2s ease-in-out infinite; transform-origin: 50% 100%; }   /* se mece el puntero entero, con su texto */
  .pin-b img { display: block; width: 100%; height: auto; pointer-events: none; filter: drop-shadow(0 0 7px rgba(201, 162, 75, .55)) drop-shadow(0 4px 6px rgba(0, 0, 0, .6)); }
  .pin-b.en-mano { opacity: .3; animation: none; }
  .pin-b.puesto { cursor: default; opacity: .55; animation: none; }
  @keyframes oscila { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .pin { position: absolute; width: var(--pw); z-index: 7; transform: translate(-50%, -100%); transform-origin: 50% 100%; cursor: pointer; perspective: 700px; transition: transform .2s; }
  .pin-giro { position: relative; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3, 1.2, .5, 1); }
  .pin.girado .pin-giro { transform: rotateY(180deg); }
  .pin .cara { position: relative; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .pin .cara img { display: block; width: 100%; height: auto; filter: drop-shadow(0 0 7px rgba(201, 162, 75, .55)) drop-shadow(0 4px 6px rgba(0, 0, 0, .7)); }
  .pin .dorso { position: absolute; inset: 0; transform: rotateY(180deg); }
  .pin:not(.antiguo) { transform: translate(-50%, -100%) scale(1.3); }   /* los de la ronda actual se quedan un poco más grandes hasta que cambian las preguntas */
  .pin .etq-antes { position: absolute; left: 100%; bottom: 2px; margin-left: 5px; padding: 1px 8px; border-radius: 99px; background: var(--oro); color: #2b1805; font-family: var(--fuente-nombres); font-weight: 700; font-size: .72rem; white-space: nowrap; pointer-events: none; }
  .pin.antiguo .cara img { filter: drop-shadow(0 0 8px rgba(139, 76, 192, .95)) drop-shadow(0 4px 6px rgba(0, 0, 0, .7)); opacity: .82; }   /* ya jugados: brillo violeta; los de la ronda actual, dorado */
  .pin:focus-visible { z-index: 14; }
  @media (hover: hover) { .pin:hover { transform: translate(-50%, -100%) scale(2.3); z-index: 14; } }
  .pin.auto { transform: translate(-50%, -100%) scale(2.3); z-index: 14; transition: transform .45s cubic-bezier(.3, 1.3, .5, 1); }   /* se agranda solo al colocarse */
  .pin.vuela { transition: left .9s cubic-bezier(.3, 1.35, .5, 1), top .9s cubic-bezier(.3, 1.35, .5, 1), transform .2s; }
  .pin.flot { position: fixed; z-index: 1000; transform: none; pointer-events: none; opacity: .92; perspective: none; }
  .pin.flot > img { display: block; width: 100%; height: auto; transform: scale(1.12); filter: drop-shadow(0 10px 12px rgba(0, 0, 0, .7)); }
  .pin.flot.ok > img { filter: drop-shadow(0 0 12px rgba(232, 206, 134, .9)); }
  body.arrastrando { cursor: grabbing; }
  /* año de la guía por encima de la imagen de contexto: solo se ve cuando la guía pasa por debajo de ella */
  .guia-top { position: fixed; z-index: 1001; transform: translateX(-50%); min-width: 72px; padding: 2px 10px; text-align: center; border-radius: 99px; background: var(--oro); color: #2b1805; font-family: var(--fuente-nombres); font-weight: 700; font-size: .95rem; box-shadow: 0 0 10px rgba(232, 206, 134, .6); pointer-events: none; }
  .guia-top[hidden] { display: none; }
  /* imagen de contexto de una pareja (p. ej. un cartel): sale en el centro al aparecer las preguntas y viaja a la esquina superior derecha para no molestar */
  .contexto { position: fixed; z-index: 60; right: 14px; top: 104px; margin: 0; width: min(300px, 70vw); padding: 8px 8px 6px; text-align: center; cursor: pointer; transform-origin: 100% 0;
    background: var(--panel); border: 1px solid rgba(201, 162, 75, .6); border-radius: 12px; box-shadow: 0 18px 50px rgba(0, 0, 0, .85);
    opacity: 0; transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(.7); transition: transform .9s cubic-bezier(.3, 1.1, .5, 1), opacity .5s; }
  .contexto[hidden] { display: none; }
  .contexto { padding: 26px 8px 24px; }
  .contexto::before, .contexto::after { content: ""; position: absolute; left: 0; right: 0; height: 40px; pointer-events: none; background: url("img/opt/enredadera-fina.webp") center / auto 100% repeat-x; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .7)); }
  .contexto::before { top: -17px; } .contexto::after { bottom: -17px; transform: scaleY(-1); }   /* enredadera fina de Mireia, arriba y abajo */
  /* rótulo escrito sobre la imagen (p. ej. «Real Academia Española»), como texto para poder traducirlo */
  .contexto .rotulo { position: absolute; left: 8px; right: 8px; bottom: 24px; padding: 28px 8px 9px; text-align: center; font-family: var(--fuente-nombres); font-weight: 700; font-size: 1.12rem; letter-spacing: .03em; line-height: 1.15; color: var(--oro-claro); text-shadow: 0 1px 3px #000, 0 0 8px rgba(0, 0, 0, .9); background: linear-gradient(180deg, transparent, rgba(8, 5, 12, .82) 70%); border-radius: 0 0 6px 6px; pointer-events: none; }
  .contexto .rotulo[hidden] { display: none; }
  .contexto img { display: block; width: 100%; height: auto; border-radius: 6px; }
  .contexto.centro { opacity: 1; transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(1); }
  .contexto.rincon { opacity: .97; transform: scale(.62); }
  @media (max-width: 899px) { .contexto.rincon { transform: scale(.46); } }
  @media (hover: hover) { .contexto.rincon:hover { transform: scale(1); z-index: 70; } }
  body.sin-efectos .contexto { transition: none !important; }
  /* recorrido que se ilumina entre los dos puntos de la pareja, con los años de diferencia */
  .camino .ruta { fill: none; stroke: var(--oro-claro); stroke-width: 8; stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(232, 206, 134, .95)); transition: opacity .7s; }
  .camino .ruta.apaga { opacity: 0; }
  .dif { position: absolute; z-index: 9; transform: translate(-50%, -190%); padding: 6px 18px; border-radius: 99px; background: var(--oro); color: #2b1805; font-family: var(--fuente-nombres); font-weight: 700; font-size: 1rem; box-shadow: 0 0 16px rgba(232, 206, 134, .8); pointer-events: none; transition: opacity .7s; white-space: nowrap; animation: crece .9s cubic-bezier(.3, 1.5, .5, 1) both; }
  @keyframes crece { 0% { transform: translate(-50%, -190%) scale(.2); opacity: 0; } 55% { transform: translate(-50%, -190%) scale(1.45); opacity: 1; } 100% { transform: translate(-50%, -190%) scale(1.15); opacity: 1; } }
  .dif.apaga { opacity: 0; }
  /* KAN-1 1.1: «Tu año / Año real / diferencia» ya no sale junto al puntero (tapaba la línea): va en la bandeja, una entrada por puntero colocado.
     En pantallas anchas ocupa el hueco libre a la derecha de las tarjetas; en las demás, la columna de la derecha, bajo «Pareja N de M». */
  .res-pin { display: grid; gap: 8px; margin: 0 0 8px; }
  .res-pin:empty { display: none; }
  .res-item { padding: 6px 10px; border-left: 3px solid var(--oro); border-radius: 0 10px 10px 0; background: rgba(232, 206, 134, .08); font-size: .85rem; line-height: 1.3; color: var(--blanco); animation: aparece .35s ease-out both; }
  .res-item strong { display: block; font-family: var(--fuente-nombres); font-size: .78rem; letter-spacing: .03em; color: var(--oro-claro); }
  .res-item span { display: block; }
  .res-item .dif-txt { font-weight: 700; color: var(--oro-claro); }
  /* escritorio intermedio (900–1819 px): no hay hueco ni la columna aguanta más altura; el resultado va dentro de la tarjeta de su puntero, bajo la pregunta */
  .res-card { display: none; margin-top: 6px; padding: 5px 10px; border-left: 3px solid var(--oro); border-radius: 0 10px 10px 0; background: rgba(232, 206, 134, .08); font-size: .82rem; line-height: 1.3; color: var(--blanco); animation: aparece .35s ease-out both; }
  .res-card span { display: block; }
  .res-card .dif-txt { font-weight: 700; color: var(--oro-claro); }
  @media (min-width: 900px) and (max-width: 1819px) { .res-card { display: block; } .res-pin { display: none; } }
  @media (min-width: 1820px) {
    .bandeja .envoltorio { position: relative; }
    .res-pin { position: absolute; top: 50%; transform: translateY(-50%); margin: 0; left: calc((100% - 274px) / 2 + 505px); width: calc((100% - 274px) / 2 - 515px); }
  }
  @keyframes aparece { from { opacity: 0; margin-top: 8px; } to { opacity: 1; margin-top: 0; } }
  body.sin-efectos .pin.auto, body.sin-efectos .pin.vuela, body.sin-efectos .pin-giro, body.sin-efectos .pin-b, body.sin-efectos .btn.brilla, body.sin-efectos .dif, body.sin-efectos .res-item { transition: none !important; animation: none !important; }
  .ref-enlace { margin: 8px 0 0; font-size: .88rem; color: var(--suave); }
  @media (min-width: 900px) { .ref-enlace { flex-basis: 100%; margin: 4px 0 0; font-size: .82rem; } }

  /* ---------- Cuadro de información de una isla: esquineras de filigrana doradas e hilo dorado, como las ventanas del Vinilo ---------- */
  dialog.info { position: relative; overflow-x: clip; overflow-y: auto; max-height: calc(100vh - 20px); width: min(560px, calc(100% - 28px)); padding: 34px clamp(34px, 9vw, 46px) 30px; color: var(--blanco); background: var(--panel); border: 1px solid rgba(201, 162, 75, .55); border-radius: 14px; box-shadow: 0 20px 50px rgba(0, 0, 0, .7); }
  dialog.info::backdrop { background: rgba(0, 0, 0, .75); }
  dialog.info::before { content: ""; position: absolute; inset: 6px; pointer-events: none; z-index: 2; --esq: clamp(64px, 17vw, 96px);
    background: url("img/opt/esquina-dorada-tl.webp") left top / var(--esq) auto no-repeat, url("img/opt/esquina-dorada-tr.webp") right top / var(--esq) auto no-repeat,
                url("img/opt/esquina-dorada-bl.webp") left bottom / var(--esq) auto no-repeat, url("img/opt/esquina-dorada-br.webp") right bottom / var(--esq) auto no-repeat; }
  dialog.info > * { position: relative; z-index: 1; }
  dialog.info .foto { display: block; width: 100%; height: clamp(200px, 40vh, 340px); object-fit: contain; margin: 0 auto 10px; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .55)); }   /* mismo tamaño para todas las islas, sean altas o apaisadas */

  (function () { var r = $('refEnlace'), a = el('a', '', TXT.refEnlaceEnlace); a.href = URL_REFERENCIAS; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', TXT.refEnlaceEnlace + TXT.nuevaPestana); r.appendChild(document.createTextNode(TXT.refEnlaceAntes)); r.appendChild(a); r.appendChild(document.createTextNode(TXT.refEnlaceDespues)); })();

  var PASO = 4;                                      /* separación (px) de las muestras con que se mide el camino */

  /* botón de una isla: imagen + leyenda (nombre y años) */

      if (fase === 'listo') { bt = el('button', 'btn primario brilla', TXT.verExplicacion); bt.addEventListener('click', verExplicacion); }
      else { bt = el('button', 'btn primario', ronda + 1 < datos.parejas.length ? TXT.siguiente : TXT.verResumen); bt.addEventListener('click', siguienteRonda); }
      bt.type = 'button'; acc.appendChild(bt);
    } else if (seleccion && anioGuia !== null && !hechas[seleccion]) {
      var cc = cartasRonda.filter(function (x) { return x.id === seleccion; })[0], b2 = el('button', 'btn primario', TXT.colocarEn(anioGuia)); b2.type = 'button';
      b2.addEventListener('click', function () { var a = anioGuia; $('guia').hidden = true; anioGuia = null; colocar(cc, a); });
      acc.appendChild(b2);
    }
  }
  function verExplicacion() {
    fase = 'explicado'; document.body.dataset.fase = fase; rondasHechas = Math.max(rondasHechas, ronda + 1);
    $('cartas').classList.add('expl'); cartasRonda.forEach(pintarTxt); pintarTextoSel(); actualizarAcc();
    $('bandeja').scrollTop = 0;
  }
  /* tras cada pareja: «Seguir jugando» pasa a las siguientes cartas; tras la última sale el resumen final, con «Jugar otra vez» */
  function siguienteRonda() { ronda++; if (ronda < datos.parejas.length) { iniciarRonda(); } else { mostrarFinal(); } }
  function iniciarRonda() {
    var pa = datos.parejas[ronda]; cartasRonda = pa.cartas; hechas = {}; fase = 'juego'; document.body.dataset.fase = fase;
    Array.prototype.forEach.call(document.querySelectorAll('.pin'), function (n) { n.classList.add('antiguo'); });   /* los de la ronda anterior pasan a «ya jugados» */
    $('ronda').textContent = TXT.ronda(ronda + 1, datos.parejas.length); $('resPin').textContent = ''; $('comp').textContent = ''; $('ayuda').textContent = TXT.ayudaArrastra;
    var cont = $('cartas'); cont.textContent = ''; cont.className = 'cartas'; pa.cartas.forEach(function (c) { cont.appendChild(crearCarta(c)); pintarTxt(c); });
    seleccionar(pa.cartas[0]); mostrarContexto(pa);
  }
  function mostrarFinal() {
    $('contexto').hidden = true; clearTimeout(ctxT); cartasRonda = []; var cont = $('cartas'); cont.textContent = ''; cont.className = 'cartas'; $('ronda').textContent = TXT.resumen; $('resPin').textContent = ''; $('ayuda').textContent = ''; $('textoSel').textContent = '';
    var media = Math.round(puestos.reduce(function (t, p) { return t + p.diff; }, 0) / Math.max(1, puestos.length));
    cont.appendChild(el('p', 'final', TXT.finalTexto(puestos.length, media))); $('comp').textContent = TXT.finalMensaje;
    var acc = $('acc'); acc.textContent = ''; var o = el('button', 'btn primario', TXT.jugarOtra); o.type = 'button';
    o.addEventListener('click', function () { puestos = []; ronda = 0; iniciarRonda(); dibujar(); }); acc.appendChild(o);
  }


  fetch('data/timeline.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    datos = d; iniciarRonda(); dibujar();
    var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(function () { if (!arr) { dibujar(); } }, 150); });
  }).catch(function () { $('linea').textContent = 'No se han podido cargar los datos.'; });
})();
</script>
