<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glosario feminista · Feminist</title>
<!-- BOCETO del glosario (25-11-2026).
     Una letra cada vez con botón «Ver todas» y buscador. Las letras son los dibujos de Mireia (img/opt/glosario/letra-*.webp).
     Datos en data/glosario.json: definiciones LITERALES del Glosario de «Dones i feminismes» (Ajuntament de Barcelona); no se pueden modificar.
     Las fuentes están en la página de referencias (data/fuentes-actividades.json); el crédito corto del Ayuntamiento va en el pie. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/encaje-pie.css">
<style>
  :root {
    --negro: #101010; --blanco: #F5F5F0; --morado: #6B2D8C; --oro: #C9A24B; --oro-claro: #E8CE86;
    --fondo: #101010; --panel: #17121f; --linea: rgba(201, 162, 75, .35); --suave: #b9b1c9;
    --fuente-titulos: "Cinzel Decorative", Georgia, serif; --fuente-nombres: "Cinzel", Georgia, serif;
    --fuente-texto: "Atkinson Hyperlegible Next", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--fondo); color: var(--blanco); font-family: var(--fuente-texto); font-size: 1rem; line-height: 1.5; }
  /* El foco es un brillo dorado, no un cuadrado */
  html :focus-visible { outline: none; }
  a { color: var(--oro-claro); }
  .envoltorio { width: min(1040px, 100% - 32px); margin-inline: auto; }
  header.cab { padding: 18px 0 4px; }
  .logo { display: block; width: fit-content; font-family: var(--fuente-titulos); font-weight: 700; font-size: 1.4rem; color: var(--blanco); text-decoration: none; }
  h1 { display: inline-block; margin: 22px 0 8px; padding: .25em .7em; background: var(--morado); color: var(--blanco); transform: rotate(-1.2deg); box-shadow: 5px 5px 0 var(--blanco);
    font-family: var(--fuente-titulos); font-weight: 700; font-size: clamp(1.4rem, 5vw, 2.2rem); line-height: 1.25; }
  .sub { max-width: 62ch; color: #e6e0f0; margin: 6px 0 0; }
  .aviso-boceto { margin: 14px 0 0; padding: 8px 12px; border: 0; border-left: 4px solid var(--oro); background: rgba(201, 162, 75, .08); border-radius: 0 10px 10px 0; color: var(--oro-claro); font-size: .9rem; }
  main { padding: 20px 0 28px; }

  /* ---------- Buscador ---------- */
  .buscar label { display: block; margin: 0 0 6px; font-family: var(--fuente-nombres); font-weight: 700; color: var(--oro-claro); }
  .buscar .campo { display: flex; gap: 8px; max-width: 560px; }
  .buscar input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; font: inherit; color: var(--blanco); background: var(--panel); border: 2px solid var(--linea); border-radius: 12px; }
  .buscar input:focus-visible { border-color: var(--oro); box-shadow: 0 0 12px 3px rgba(232, 206, 134, .55); }
  .buscar input::placeholder { color: var(--suave); }
  .btn-sec { min-height: 48px; padding: 0 16px; font: inherit; font-weight: 700; color: var(--blanco); background: transparent; border: 2px solid var(--linea); border-radius: 12px; cursor: pointer; }
  .btn-sec:hover { border-color: var(--oro); }
  .btn-sec[hidden] { display: none; }

  /* ---------- Abecedario con las letras de Mireia ---------- */
  .abc { display: flex; flex-wrap: wrap; gap: 6px 4px; margin: 18px 0 6px; padding: 8px 4px; }   /* el relleno deja sitio al brillo */
  .abc button { display: grid; place-items: center; width: 56px; height: 66px; padding: 0; background: none; border: 0; cursor: pointer; border-radius: 12px; transition: transform .15s; }
  .abc button img { display: block; max-width: 52px; max-height: 62px; width: auto; height: auto; opacity: .75; transition: opacity .15s, filter .15s; }
  .abc button:hover img { opacity: 1; }
  .abc button:hover { transform: translateY(-2px); }
  .abc button[aria-pressed="true"] img, .abc button:focus-visible img { opacity: 1; filter: drop-shadow(0 0 7px rgba(232, 206, 134, .95)) drop-shadow(0 0 16px rgba(201, 162, 75, .7)); }
  .abc button.todas { width: auto; min-width: 84px; padding: 0 14px; height: 48px; align-self: center; margin-right: 6px; font: inherit; font-family: var(--fuente-nombres); font-weight: 700; color: var(--blanco); border: 2px solid var(--linea); }
  .abc button.todas[aria-pressed="true"], .abc button.todas:focus-visible { border-color: var(--oro); color: var(--oro-claro); box-shadow: 0 0 12px 3px rgba(232, 206, 134, .55); }
  @media (min-width: 700px) { .abc button { width: 64px; height: 76px; } .abc button img { max-width: 60px; max-height: 72px; } }

  .estado { min-height: 1.5em; margin: 4px 0 14px; color: var(--suave); }

  /* ---------- Lista de términos ---------- */
  .cab-letra { display: flex; align-items: center; gap: 16px; margin: 6px 0 14px; }
  .cab-letra img { display: block; height: 120px; width: auto; max-width: 40vw; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .6)); }
  .cab-letra.peque img { height: 72px; }
  .cab-letra h2 { margin: 0; font-family: var(--fuente-nombres); font-size: clamp(1.1rem, 4vw, 1.4rem); color: var(--oro-claro); }
  .grupo + .grupo { margin-top: 26px; }
  .terminos { display: grid; gap: 10px; margin: 0; padding: 4px; list-style: none; }   /* relleno para el brillo */
  @media (min-width: 820px) { .terminos { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
  .termino { border: 2px solid var(--linea); border-radius: 14px; background: var(--panel); transition: border-color .15s; }
  .termino[open] { border-color: var(--oro); }
  .termino summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 10px 16px; cursor: pointer; border-radius: 12px;
    font-family: var(--fuente-nombres); font-weight: 700; font-size: 1.08rem; line-height: 1.25; }
  .termino summary::-webkit-details-marker { display: none; }
  .termino summary::after { content: "+"; flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--linea); border-radius: 50%; font-family: var(--fuente-texto); color: var(--oro-claro); }
  .termino[open] summary::after { content: "–"; }
  .termino summary:focus-visible { box-shadow: 0 0 12px 3px rgba(232, 206, 134, .6); }
  .termino .def { padding: 0 16px 16px; }
  .termino .def p { margin: 0; color: #ece7f4; }
  .termino.destacado { animation: destello 1.6s ease-out 1; }
  @keyframes destello { 0% { box-shadow: 0 0 0 0 rgba(232, 206, 134, 0); } 25% { box-shadow: 0 0 18px 5px rgba(232, 206, 134, .8); } 100% { box-shadow: 0 0 0 0 rgba(232, 206, 134, 0); } }
  .letra-chip { margin-left: 8px; padding: 0 8px; font-family: var(--fuente-texto); font-size: .75rem; font-weight: 700; color: var(--oro-claro); border: 1px solid var(--linea); border-radius: 99px; white-space: nowrap; }
  .vacio { padding: 18px; border-left: 4px solid var(--oro); background: rgba(201, 162, 75, .08); border-radius: 0 12px 12px 0; }
  .error { color: #e0524b; }

  footer { margin-top: auto; background: #000; border-top: 2px solid rgba(185, 177, 201, .35); }
  footer .envoltorio { padding: 20px 0 26px; }
  .firma { margin: 0; font-family: var(--fuente-titulos); font-weight: 700; font-size: 1.05rem; color: var(--oro-claro); }
  .fuente-pie { margin: 10px 0 0; font-size: .85rem; color: var(--suave); }
  .fuente-pie a { color: var(--oro-claro); }
  @media (prefers-reduced-motion: reduce) { .abc button, .abc button img, .termino { transition: none; } .termino.destacado { animation: none; } .abc button:hover { transform: none; } }
  /* fondo de espirales irregulares, muy suaves (iguales que en las actividades); el contenido va por encima */
  .fondo-esp { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .esp { position: absolute; }
  .esp.e1 { left: 3%; top: 9%; width: min(250px, 55vw); opacity: .075; animation: gira2 80s linear infinite; }
  .esp.e2 { right: 2%; top: 34%; width: min(400px, 80vw); opacity: .065; animation: gira1 110s linear infinite; }
  .esp.e3 { left: 9%; bottom: 3%; width: min(540px, 100vw); opacity: .055; animation: gira2 140s linear infinite; }
  @keyframes gira1 { to { transform: rotate(360deg); } } @keyframes gira2 { to { transform: rotate(-360deg); } }
  .fondo-esp.quieto .esp { animation: none; }
  @media (prefers-reduced-motion: reduce) { .esp { animation: none; } }
  header.cab, main, footer { position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="fondo-esp" aria-hidden="true"><svg class="esp e1" id="esp1" viewBox="-400 -400 800 800"></svg><svg class="esp e2" id="esp2" viewBox="-400 -400 800 800"></svg><svg class="esp e3" id="esp3" viewBox="-400 -400 800 800"></svg></div>
<header class="cab"><div class="envoltorio">
  <a class="logo" href="propuesta-d-mezcla.html">♀ Feminist</a>
  <h1 id="titulo"></h1>
  <p class="sub" id="subtitulo"></p>
  <p class="aviso-boceto" id="avisoBoceto"></p>
</div></header>

<main class="envoltorio">
  <div class="buscar">
    <label for="q" id="lBuscar"></label>
    <div class="campo">
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <button class="btn-sec" id="qLimpiar" type="button" hidden></button>
    </div>
  </div>
  <nav class="abc" id="abc" aria-label="Letras del glosario"></nav>
  <p class="estado" id="estado" aria-live="polite"></p>
  <section id="lista" aria-label="Palabras"></section>
  <p class="error" id="msgError" role="alert" hidden></p>
</main>

<footer><div class="envoltorio">
  <p class="firma">Web diseñada y creada por Mireia Gutiérrez Águila<span style="margin:0 8px;font-weight:400">–</span><a href="https://mireiagutierrezaguila.github.io/Portfolio_Mireia/" target="_blank" rel="noopener" style="font-family:var(--fuente-texto,system-ui,sans-serif);font-size:1rem;font-weight:400;letter-spacing:0;color:inherit;text-decoration:underline;opacity:.9">Conoce su historia</a></p>
  <p class="fuente-pie" id="creditoPie"></p>
</div></footer>

<script>
(function () {
  'use strict';
  /* Textos (después irán a los archivos de idioma; ca/en pendientes de traducir y de revisión de Mireia) */
  var TXT = {
    titulo: 'Glosario feminista',
    subtitulo: 'Palabras que conviene conocer, explicadas por profesionales.',
    aviso: 'Boceto: diseño provisional. Las definiciones son literales del glosario «Dones i feminismes» del Ayuntamiento de Barcelona. Las de inglés están pendientes de traducir.',
    buscar: 'Buscar una palabra', buscarPh: 'Escribe una palabra o parte de ella…', limpiar: 'Borrar',
    todas: 'Ver todas', letraDe: function (l) { return 'Letra ' + l; },
    nPalabras: function (n) { return n + (n === 1 ? ' palabra' : ' palabras'); },
    aLetra: function (l, n) { return 'Letra ' + l + ': ' + n + (n === 1 ? ' palabra' : ' palabras'); },
    resultados: function (n, q) { return n + (n === 1 ? ' resultado' : ' resultados') + ' para «' + q + '»'; },
    sinResultados: function (q) { return 'No hemos encontrado nada para «' + q + '». Prueba con otra palabra o mira todas las letras.'; },
    totalTodas: function (n) { return 'Todas las palabras: ' + n + '.'; },
    credito: 'Definiciones: glosario de «Dones i feminismes», Ajuntament de Barcelona (reproducidas sin cambios). ', creditoEnlace: 'Ver el glosario original',
    nuevaPestana: ' (se abre en una pestaña nueva)',
    errorCarga: 'No se ha podido cargar el glosario. Prueba a recargar la página.'
  };
  var LANG = 'es', datos = null, porLetra = {}, letras = [], modo = null;
  function $(id) { return document.getElementById(id); }
  function el(t, c, x) { var e = document.createElement(t); if (c) { e.className = c; } if (x !== undefined) { e.textContent = x; } return e; }
  /* Si falta la traducción (marcador pendiente) se usa el castellano */
  function L(o, campo) { var v = o[LANG] && o[LANG][campo]; return v && v.indexOf('[TRADUCCIÓN') !== 0 ? v : o.es[campo]; }
  function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  $('titulo').textContent = TXT.titulo; $('subtitulo').textContent = TXT.subtitulo; $('avisoBoceto').textContent = TXT.aviso;
  $('lBuscar').textContent = TXT.buscar; $('q').placeholder = TXT.buscarPh; $('qLimpiar').textContent = TXT.limpiar;

  function tarjeta(t, conLetra) {
    var d = el('details', 'termino'), s = el('summary', '', L(t, 'termino')), c = el('div', 'def');
    d.id = 't-' + t.id; c.appendChild(el('p', '', L(t, 'definicion')));
    if (conLetra) { s.insertBefore(el('span', 'letra-chip', t.letra), null); }
    d.appendChild(s); d.appendChild(c); return d;
  }
  function imgLetra(l, alto) { var i = new Image(); i.src = 'img/opt/glosario/letra-' + l.toLowerCase() + '.webp'; i.alt = ''; i.height = alto; i.decoding = 'async'; return i; }
  function grupo(l, peque) {
    var g = el('div', 'grupo'), cab = el('div', 'cab-letra' + (peque ? ' peque' : '')), h = el('h2', '', TXT.letraDe(l) + ' · ' + TXT.nPalabras(porLetra[l].length)), ul = el('ul', 'terminos');
    cab.appendChild(imgLetra(l, peque ? 72 : 120)); cab.appendChild(h); g.appendChild(cab);
    porLetra[l].forEach(function (t) { var li = el('li'); li.appendChild(tarjeta(t, false)); ul.appendChild(li); }); g.appendChild(ul); return g;
  }
  function marcar(activo) {
    Array.prototype.forEach.call($('abc').children, function (b) { b.setAttribute('aria-pressed', b.dataset.k === activo ? 'true' : 'false'); });
  }
  function limpiarLista() { $('lista').textContent = ''; }
  function verLetra(l, sinScroll) {
    modo = l; $('q').value = ''; $('qLimpiar').hidden = true; marcar(l); limpiarLista(); $('lista').appendChild(grupo(l, false));
    $('estado').textContent = TXT.aLetra(l, porLetra[l].length);
  }
  function verTodas() {
    modo = '*'; $('q').value = ''; $('qLimpiar').hidden = true; marcar('*'); limpiarLista();
    letras.forEach(function (l) { $('lista').appendChild(grupo(l, true)); });
    $('estado').textContent = TXT.totalTodas(datos.terminos.length);
  }
  function buscar(q) {
    var n = norm(q.trim()), res, ul;
    $('qLimpiar').hidden = !q; if (!n) { if (modo === 'busqueda') { verLetra(letras[0]); } return; }
    modo = 'busqueda'; marcar(null); limpiarLista();
    /* primero las palabras cuyo nombre coincide; después las que solo lo mencionan en la definición */
    var enNombre = datos.terminos.filter(function (t) { return norm(L(t, 'termino')).indexOf(n) !== -1 || norm(t.es.termino).indexOf(n) !== -1; });
    var enDef = datos.terminos.filter(function (t) { return enNombre.indexOf(t) === -1 && norm(L(t, 'definicion')).indexOf(n) !== -1; });
    res = enNombre.concat(enDef);
    $('estado').textContent = res.length ? TXT.resultados(res.length, q.trim()) : '';
    if (!res.length) { $('lista').appendChild(el('p', 'vacio', TXT.sinResultados(q.trim()))); return; }
    ul = el('ul', 'terminos'); res.forEach(function (t) { var li = el('li'); li.appendChild(tarjeta(t, true)); ul.appendChild(li); }); $('lista').appendChild(ul);
  }
  /* Enlace directo a una palabra (#sororidad): abre su letra y la tarjeta */
  function irAPalabra(id) {
    var t = datos.terminos.filter(function (x) { return x.id === id; })[0]; if (!t) { return false; }
    verLetra(t.letra); var d = $('t-' + id); d.open = true; d.classList.add('destacado');
    d.scrollIntoView({ block: 'center', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return true;
  }
  function hash() { var h = decodeURIComponent(location.hash.replace('#', '')); if (!h || !irAPalabra(h)) { if (!modo) { verLetra(letras[0]); } } }

  function montarAbc() {
    var a = $('abc'), b = el('button', 'todas', TXT.todas); b.type = 'button'; b.dataset.k = '*'; b.addEventListener('click', verTodas); a.appendChild(b);
    letras.forEach(function (l) {
      var x = el('button'); x.type = 'button'; x.dataset.k = l; x.setAttribute('aria-label', TXT.aLetra(l, porLetra[l].length)); x.appendChild(imgLetra(l, 62));
      x.addEventListener('click', function () { verLetra(l); }); a.appendChild(x);
    });
  }

  fetch('data/glosario.json').then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); }).then(function (d) {
    datos = d;
    d.terminos.forEach(function (t) { if (!porLetra[t.letra]) { porLetra[t.letra] = []; letras.push(t.letra); } porLetra[t.letra].push(t); });
    var c = $('creditoPie'), a = el('a', '', TXT.creditoEnlace); a.href = d.fuente.url[LANG] || d.fuente.url.es; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', TXT.creditoEnlace + TXT.nuevaPestana);
    c.appendChild(document.createTextNode(TXT.credito)); c.appendChild(a);
    montarAbc(); hash();
    $('q').addEventListener('input', function () { buscar(this.value); });
    $('qLimpiar').addEventListener('click', function () { verLetra(letras[0]); $('q').focus(); });
    window.addEventListener('hashchange', hash);
  }).catch(function () { var e = $('msgError'); e.textContent = TXT.errorCarga; e.hidden = false; });
})();
</script>
<script>
/* Espirales de fondo irregulares (como las de la portada y las actividades). Si en otra página se pulsó «Parar efectos», aquí no giran. */
(function () {
  function irregular(vueltas, escala, semilla) {
    var pts = [];
    for (var t = 0; t <= vueltas * 2 * Math.PI; t += 0.12) {
      var r = escala * t * (1 + 0.11 * Math.sin(t * 1.3 + semilla) + 0.07 * Math.sin(t * 3.1 + 2 * semilla)), a = t + 0.06 * Math.sin(t * 2.2 + semilla);
      pts.push((r * Math.cos(a)).toFixed(1) + ' ' + (r * Math.sin(a)).toFixed(1));
    }
    return 'M' + pts.join(' L');
  }
  function pintar(id, vueltas, escala, semilla) {
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', irregular(vueltas, escala, semilla)); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#F5F5F0');
    p.setAttribute('stroke-width', '15'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
    document.getElementById(id).appendChild(p);
  }
  [['esp1', 11, 4.4, 1.7], ['esp2', 8, 6.2, 4.1], ['esp3', 9, 5.2, 2.9]].forEach(function (e) { pintar(e[0], e[1], e[2], e[3]); });
  try { if (localStorage.getItem('feminist-sin-efectos') === '1') { document.querySelector('.fondo-esp').classList.add('quieto'); } } catch (e) { /* sin almacenamiento */ }
})();
</script>
<script src="js/estela.js"></script>
</body>
</html>
