<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La mujer en el mundo · Feminist</title>
<!-- BOCETO (paso 1) de la actividad del mapamundi. Todavía SIN datos feministas: solo se comprueba el mapa (países, nombres que caben,
     tocar un país, zoom y desplazamiento). Mapa: países de Natural Earth (dominio público) en data/mapa-paises.json, dibujados con la
     proyección Equal Earth (igual área: los tamaños son los reales, África sale de su tamaño). La proyección se calcula aquí, sin librerías.
     Estilo: el de las demás actividades (fondo de espirales, cabecera morada, marco de rosas, Cinzel, dorado y violeta). -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>

  :focus-visible { outline: 3px solid var(--oro-claro); outline-offset: 3px; }

    font-family: var(--fuente-titulos); font-weight: 700; font-size: clamp(1.4rem, 5vw, 2.2rem); line-height: 1.25; }
  .sub { max-width: 62ch; color: #e6e0f0; margin: 6px 0 0; }
  .aviso-boceto { margin: 14px 0 0; padding: 8px 12px; border: 0; border-left: 4px solid var(--oro); background: rgba(201, 162, 75, .08); border-radius: 0 10px 10px 0; color: var(--oro-claro); font-size: .9rem; }
  .ref-enlace { margin: 8px 0 0; font-size: .88rem; color: var(--suave); }
  main { padding-bottom: 36px; }
  h2 { font-family: var(--fuente-nombres); font-weight: 700; font-size: 1.25rem; margin: 0 0 12px; color: var(--oro-claro); }

  .zoom button { min-width: 40px; padding: 6px 10px; font-size: 1.15rem; line-height: 1; }
  .buscador { display: inline-flex; align-items: center; gap: 8px; }

  /* ---------- el mapa, en el marco de rosas de las otras actividades ---------- */

  .tablero::before { content: ""; position: absolute; inset: -14px; pointer-events: none; z-index: 2; --esq: clamp(96px, 20vw, 136px);

  .ayuda-mapa { margin: 8px 4px 0; font-size: .85rem; color: var(--suave); }

  .firma { margin: 0; font-family: var(--fuente-titulos); font-weight: 700; font-size: 1.05rem; color: var(--oro-claro); }
  .fuente-pie { margin: 10px 0 0; font-size: .8rem; color: var(--suave); }

  /* fondo de espirales irregulares como las de la portada, muy suaves y girando despacio */
  .fondo-esp { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .esp { position: absolute; }
  .esp.e1 { left: 3%; top: 9%; width: min(250px, 55vw); opacity: .075; animation: gira2 80s linear infinite; }
  .esp.e2 { right: 2%; top: 34%; width: min(400px, 80vw); opacity: .065; animation: gira1 110s linear infinite; }
  .esp.e3 { left: 9%; bottom: 3%; width: min(540px, 100vw); opacity: .055; animation: gira2 140s linear infinite; }
  @keyframes gira1 { to { transform: rotate(360deg); } }
  @keyframes gira2 { to { transform: rotate(-360deg); } }
  header.cab, main, footer { position: relative; z-index: 1; }
  header.cab .envoltorio { position: relative; }
  .btn-efectos { position: absolute; right: 0; top: 18px; }
  body.sin-efectos .esp { animation: none !important; }
  body.sin-efectos .pais { transition: none; }
  @media (prefers-reduced-motion: reduce) { .esp { animation: none; } .pais { transition: none; } }
  @media (max-width: 640px) { .zoom { margin-left: 0; } .buscador select { max-width: 160px; } }

</head>

      var a = punteros[ids[0]], b = punteros[ids[1]], c = aMapa((a.x + b.x) / 2, (a.y + b.y) / 2), nw = arr.w0 * arr.d0 / dist();
      zoom(vista.w / nw, c[0], c[1]); arr.movido = true; caja.classList.add('arrastrando'); return;
    }
    if (!arr) { return; }
    var dx = e.clientX - arr.x0, dy = e.clientY - arr.y0;
    if (!arr.movido && Math.hypot(dx, dy) > 5) { arr.movido = true; caja.classList.add('arrastrando'); }
    if (arr.movido) { var k = vista.w / pxAncho(); vista.x = arr.vx - dx * k; vista.y = arr.vy - dy * k; limitar(); aplicarVista(); }
  });
  function dist() { var ids = Object.keys(punteros), a = punteros[ids[0]], b = punteros[ids[1]]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; }
  function suelta(e) {
    var fueTap = arr && !arr.movido && arr.n === 1; delete punteros[e.pointerId]; caja.classList.remove('arrastrando');
    if (fueTap && e.type === 'pointerup') { var t = document.elementFromPoint(e.clientX, e.clientY); var path = t && t.closest ? t.closest('.pais') : null; elegir(path ? path.getAttribute('data-id') : null, false); }
    if (!Object.keys(punteros).length) { arr = null; } else { arr = { n: Object.keys(punteros).length, d0: 0, movido: true, w0: vista.w, vx: vista.x, vy: vista.y, x0: e.clientX, y0: e.clientY }; }
  }
  caja.addEventListener('pointerup', suelta); caja.addEventListener('pointercancel', suelta);
  caja.addEventListener('wheel', function (e) { e.preventDefault(); var c = aMapa(e.clientX, e.clientY); zoom(e.deltaY < 0 ? 1.25 : 0.8, c[0], c[1]); }, { passive: false });

  /* ---------- nombres: solo los que caben dentro del país, con el tamaño actual en pantalla ---------- */
  var ctx = document.createElement('canvas').getContext('2d'), tmrE = 0;
  function fontPx() { return window.innerWidth >= 1000 ? 10 : 11; }   // letra algo menor donde hay sitio y se lee bien; en móvil se queda en 11
  /* se recalculan cuando la vista se queda quieta un momento: mientras se arrastra, los nombres se mueven con el mapa */
  function pedirEtiquetas() { clearTimeout(tmrE); tmrE = setTimeout(pintarEtiquetas, 120); }
  function cabe(p, ancla, w, h) {   // el rectángulo del texto, centrado en el ancla, tiene que quedar entero dentro de un polígono del país
    var pts = [[0, 0], [-w / 2, -h / 2], [w / 2, -h / 2], [-w / 2, h / 2], [w / 2, h / 2], [-w / 4, 0], [w / 4, 0], [0, -h / 2], [0, h / 2]];
    for (var i = 0; i < p.polys.length; i++) {
      var poly = p.polys[i], ok = true, cj = poly.caja;
      if (a0(ancla, cj, w, h)) { continue; }
      for (var k = 0; k < pts.length && ok; k++) {
        var q = [ancla[0] + pts[k][0], ancla[1] + pts[k][1]], en = dentro(q, poly[0]);
        for (var h2 = 1; h2 < poly.length && en; h2++) { if (dentro(q, poly[h2])) { en = false; } }
        if (!en) { ok = false; }

    return false;
  }
  function a0(a, cj, w, h) { return a[0] - w / 2 < cj[0] || a[0] + w / 2 > cj[2] || a[1] - h / 2 < cj[1] || a[1] + h / 2 > cj[3]; }   // el rectángulo se sale de la caja del polígono: no cabe
  /* puntos de prueba de un país: los de Natural Earth, el centro del polígono mayor y una cuadrícula dentro de su caja (ordenados desde el centro) */
  function candidatos(p, w, h) {
    var l = p.anclas.slice(), mayor = null; p.polys.forEach(function (q) { if (!mayor || q.area > mayor.area) { mayor = q; } });
    var cj = mayor.caja, N = 9, cx = (cj[0] + cj[2]) / 2, cy = (cj[1] + cj[3]) / 2, g = [];
    if (cj[2] - cj[0] >= w && cj[3] - cj[1] >= h) { for (var i = 0; i < N; i++) { for (var j = 0; j < N; j++) { g.push([cj[0] + w / 2 + (cj[2] - cj[0] - w) * (i / (N - 1)), cj[1] + h / 2 + (cj[3] - cj[1] - h) * (j / (N - 1))]); } } }
    g.sort(function (u, v) { return Math.hypot(u[0] - cx, u[1] - cy) - Math.hypot(v[0] - cx, v[1] - cy); });
    return l.concat(g);
  }
  /* parte un nombre en dos líneas por el espacio que deje las líneas más parecidas (null si es una sola palabra) */
  function dividir(nombre) {
    var pal = nombre.split(' '); if (pal.length < 2) { return null; }
    var mejor = null, mw = 1e9;
    for (var i = 1; i < pal.length; i++) { var a = pal.slice(0, i).join(' '), b = pal.slice(i).join(' '), w = Math.max(ctx.measureText(a).width, ctx.measureText(b).width); if (w < mw) { mw = w; mejor = [a, b]; } }
    return mejor;
  }
  function pintarEtiquetas() {
    if (!base) { return; }
    var g = $('etiquetas'); g.textContent = '';
    var px = fontPx(), u = vista.w / pxAncho(), tam = px * u, hTxt = tam * 1.15, cajas = [];
    ctx.font = '700 ' + px + 'px "Atkinson Hyperlegible Next", system-ui, sans-serif';
    paises.forEach(function (p) {
      var dos = dividir(p.es), variantes = [[p.es]]; if (dos) { variantes.push(dos); }   // primero una línea; si no cabe, dos
      for (var v = 0; v < variantes.length; v++) {
        var lineas = variantes[v], wTxt = Math.max.apply(null, lineas.map(function (l) { return ctx.measureText(l).width; })) * u + tam * 0.3, hh = hTxt * lineas.length;
        var cands = candidatos(p, wTxt, hh), puesto = false;
        for (var i = 0; i < cands.length && !puesto; i++) {
          var a = cands[i];
          if (a[0] - wTxt / 2 < vista.x || a[0] + wTxt / 2 > vista.x + vista.w || a[1] - hh / 2 < vista.y || a[1] + hh / 2 > vista.y + vista.h) { continue; }   // el nombre tiene que verse entero
          if (!cabe(p, a, wTxt, hh)) { continue; }
          var caja = [a[0] - wTxt / 2, a[1] - hh / 2, a[0] + wTxt / 2, a[1] + hh / 2], choca = false;
          for (var c = 0; c < cajas.length && !choca; c++) { var o = cajas[c]; if (caja[0] < o[2] && caja[2] > o[0] && caja[1] < o[3] && caja[3] > o[1]) { choca = true; } }
          if (choca) { continue; }
          cajas.push(caja); puesto = true;
          lineas.forEach(function (l, k) {
            var t = document.createElementNS(SVGNS, 'text'); t.setAttribute('class', 'etiqueta'); t.setAttribute('x', a[0].toFixed(1)); t.setAttribute('y', (a[1] + (k - (lineas.length - 1) / 2) * hTxt).toFixed(1));
            t.setAttribute('font-size', tam.toFixed(2)); t.setAttribute('stroke-width', (tam * 0.22).toFixed(2)); t.textContent = l; g.appendChild(t);
          });
        }
        if (puesto) { break; }
      }
    });
  }

  /* ---------- seleccionar un país y pintar un continente (demostración) ---------- */
  function elegir(id, ir) {
    if (selId && porId[selId]) { porId[selId].el.classList.remove('sel'); }
    selId = id && porId[id] ? id : null; var f = $('ficha'); f.textContent = ''; $('selPais').value = selId || '';
    if (!selId) { f.textContent = TXT.fichaVacia; return; }
    var p = porId[selId]; p.el.classList.add('sel'); p.el.parentNode.appendChild(p.el);   // encima de sus vecinos para que se vea el borde dorado
    f.appendChild(el('h3', '', p.es)); f.appendChild(el('p', 'en', p.en));
    f.appendChild(el('p', '', TXT.continente + ': ' + (CONT[p.cont] || p.cont) + ' · ' + (TIPO[p.tipo] || p.tipo) + (p.tipo === 'Dependency' ? ' de ' + (porSob(p.sob) || p.sob) : '')));
    f.appendChild(el('p', 'en', TXT.clasif + ': ' + p.tipo));
    if (ir) { irA(p); }
  }
  function porSob(nombre) { for (var i = 0; i < paises.length; i++) { if (paises[i].en === nombre || paises[i].es === nombre) { return paises[i].es; } } return ''; }
  function irA(p) {   // acerca la vista al país más grande de sus polígonos
    var mx = 1e9, my = 1e9, Mx = -1e9, My = -1e9, mayor = null, a0 = 0;
    p.polys.forEach(function (poly) { var a = Math.abs(areaRing(poly[0])); if (a > a0) { a0 = a; mayor = poly[0]; } });
    mayor.forEach(function (c) { mx = Math.min(mx, c[0]); Mx = Math.max(Mx, c[0]); my = Math.min(my, c[1]); My = Math.max(My, c[1]); });
    var w = Math.max((Mx - mx) * 2.2, base.w / 14), cx = (mx + Mx) / 2, cy = (my + My) / 2;
    vista.w = Math.min(w, base.w); vista.h = vista.w / aspecto; vista.x = cx - vista.w / 2; vista.y = cy - vista.h / 2; limitar(); aplicarVista();
  }
  function pintarContinente(c) {
    pintado = pintado === c ? null : c;
    paises.forEach(function (p) { p.el.classList.toggle('pintado', !!pintado && p.cont === pintado); });
    Array.prototype.forEach.call($('chips').children, function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-c') === (pintado || ''))); });
    var l = $('leyenda'); l.textContent = '';
    var a = el('span'); a.appendChild(el('i', pintado ? 'oro' : 'tierra')); a.appendChild(document.createTextNode(pintado ? TXT.leyendaPintado(CONT[pintado]) : TXT.leyendaTierra)); l.appendChild(a);
    if (pintado) { var b = el('span'); b.appendChild(el('i', 'tierra')); b.appendChild(document.createTextNode(TXT.leyendaTierra)); l.appendChild(b); }
  }

  function iniciar() {
    $('titulo').textContent = TXT.titulo; $('subtitulo').textContent = TXT.subtitulo; $('avisoBoceto').textContent = TXT.aviso;
    (function () { var r = $('refEnlace'), a = el('a', '', TXT.refEnlaceEnlace); a.href = 'fuentes-boceto.html?tipo=actividad&actividad=mapa'; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', TXT.refEnlaceEnlace + TXT.nuevaPestana); r.appendChild(document.createTextNode(TXT.refEnlaceAntes)); r.appendChild(a); r.appendChild(document.createTextNode(TXT.refEnlaceDespues)); })();
    $('mapaTit').textContent = TXT.mapaTit;
    $('rotDemo').textContent = TXT.rotDemo; $('rotBuscar').textContent = TXT.rotBuscar; $('ayudaMapa').textContent = TXT.ayuda; $('fuentePie').textContent = TXT.fuentePie;
    $('zMas').setAttribute('aria-label', TXT.zoomMas); $('zMenos').setAttribute('aria-label', TXT.zoomMenos); $('zReset').textContent = TXT.reset;
    DEMO.forEach(function (c) { var b = el('button', 'chip', CONT[c]); b.type = 'button'; b.setAttribute('data-c', c); b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', function () { pintarContinente(c); }); $('chips').appendChild(b); });
    var s = $('selPais'); s.appendChild(new Option(TXT.elegir, ''));
    paises.slice().sort(function (a, b) { return a.es.localeCompare(b.es, 'es'); }).forEach(function (p) { s.appendChild(new Option(p.es, p.id)); });
    s.addEventListener('change', function () { elegir(s.value, true); });
    $('zMas').addEventListener('click', function () { zoom(1.5); }); $('zMenos').addEventListener('click', function () { zoom(1 / 1.5); });
    $('zReset').addEventListener('click', function () { vista = { x: base.x, y: base.y, w: base.w, h: base.h }; limitar(); aplicarVista(); });
    pintarContinente(null);   // leyenda inicial (sin continente pintado)
    elegir(null);
    if (estrecha.matches) { vista.w = base.w / 2.6; vista.x = base.x + base.w * 0.32; vista.y = base.y + base.h * 0.18; }   // móvil: empieza acercado hacia África y Europa
    limitar(); aplicarVista();
    function alCambiarAncho() { var w0 = vista.w, cx = vista.x + vista.w / 2, cy = vista.y + vista.h / 2; fijaAspecto(); vista.w = w0; vista.x = cx - vista.w / 2; vista.y = cy - w0 / aspecto / 2; limitar(); aplicarVista(); }
    if (estrecha.addEventListener) { estrecha.addEventListener('change', alCambiarAncho); }
    window.addEventListener('resize', pedirEtiquetas);
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(pedirEtiquetas); }
  }
})();
