<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adivina el porcentaje · Feminist</title>
<!-- BOCETO de la actividad de porcentajes. Mecánicas y diseño provisionales; sin sonido. Ilustraciones de Mireia en img/opt/ (copias optimizadas de img/web_feminist/).
     Datos reales de las infografías «Mujeres en cifras» (Instituto de las Mujeres) en data/porcentajes.json.
     Cuatro mecánicas (contador, aguja, pintar, cara a cara) que reparte un dado trucado: no repite una mecánica hasta que han salido todas.
     Decisión de Mireia (16-11-2026): sin frase de la infografía en cada dato; la fuente va una sola vez, pequeña, en el pie. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #101010; --blanco: #F5F5F0; --morado: #6B2D8C; --oro: #C9A24B; --oro-claro: #E8CE86; --rosa: #C2386E; --verdeazul: #127C86; --naranja: #E8762B;
    --fondo: #101010; --panel: #17121f; --linea: rgba(201, 162, 75, .35); --suave: #b9b1c9;
    --bien: #3fbf7a; --alerta: #e8762b; --mal: #e0524b;
    --fuente-titulos: "Cinzel Decorative", Georgia, serif; --fuente-nombres: "Cinzel", Georgia, serif;
    --fuente-texto: "Atkinson Hyperlegible Next", system-ui, sans-serif;
    --cinta-colores: linear-gradient(90deg, #C2386E 0 25%, #127C86 25% 50%, #E8762B 50% 75%, #6B2D8C 75%);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--fondo); color: var(--blanco); font-family: var(--fuente-texto); font-size: 1rem; line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--oro-claro); outline-offset: 3px; }
  a { color: var(--oro-claro); }
  .envoltorio { width: min(1040px, 100% - 32px); margin-inline: auto; }
  header.cab { padding: 18px 0 4px; }
  .logo { display: block; width: fit-content; font-family: var(--fuente-titulos); font-weight: 700; font-size: 1.4rem; color: var(--blanco); text-decoration: none; }
  h1 { display: inline-block; margin: 22px 0 8px; padding: .25em .7em; background: var(--morado); color: var(--blanco); transform: rotate(-1.2deg); box-shadow: 5px 5px 0 var(--blanco);
    font-family: var(--fuente-titulos); font-weight: 700; font-size: clamp(1.4rem, 5vw, 2.2rem); line-height: 1.25; }
  .sub { max-width: 62ch; color: #e6e0f0; margin: 6px 0 0; }
  .aviso-boceto { margin: 14px 0 0; padding: 8px 12px; border: 1px dashed var(--oro); border-radius: 10px; color: var(--oro-claro); font-size: .9rem; }
  main { padding-bottom: 36px; }
  .pantalla { padding: 22px 0 8px; }
  [hidden] { display: none !important; }
  h2 { font-family: var(--fuente-nombres); font-weight: 700; font-size: 1.25rem; margin: 0 0 12px; color: var(--oro-claro); }
  .btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 12px; padding: 12px 22px; min-height: 52px; border: 2px solid var(--oro); background: var(--panel); color: var(--blanco); touch-action: manipulation; }
  .btn:hover { background: #231a33; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primario { background: var(--oro); color: #2b2418; }
  .btn.primario:hover { background: var(--oro-claro); }
  .btn.grande { font-size: 1.2rem; padding: 16px 28px; min-height: 64px; }
  .caja-mensaje { margin: 0 0 18px; padding: 16px 18px; border-left: 6px solid var(--rosa); background: var(--panel); border-radius: 0 12px 12px 0; max-width: 70ch; }
  .caja-mensaje p { margin: 0 0 8px; } .caja-mensaje p:last-child { margin: 0; }
  .caja-mensaje .grande { font-family: var(--fuente-nombres); font-weight: 700; font-size: 1.15rem; color: var(--oro-claro); }
  .guia { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin: 0 0 20px; padding: 0; list-style: none; }
  .guia li { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--linea); border-radius: 14px; background: var(--panel); }
  .guia .ico { font-size: 1.8rem; grid-row: span 2; }
  .guia strong { font-family: var(--fuente-nombres); color: var(--oro-claro); }
  .guia small { color: var(--suave); line-height: 1.3; }

  /* ---------- marcador y dado ---------- */
  .marcador { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 14px; color: var(--suave); }
  .etq { display: inline-block; padding: 2px 10px; border: 1px solid currentColor; border-radius: 99px; font-size: .85rem; }
  .barra { height: 8px; border-radius: 99px; background: #2a2236; overflow: hidden; margin-bottom: 16px; }
  .barra i { display: block; height: 100%; width: 0; background: var(--cinta-colores); transition: width .4s; }
  .dado-caja { display: grid; justify-items: center; gap: 22px; padding: 38px 16px 30px; border: 2px dashed var(--oro); border-radius: 20px; background: var(--panel); text-align: center; }
  /* el dado (un d20 ilustrado) es el propio botón: grande, con un play que dice «tócame».
     El d20 es azul neón: se tiñe a dorado con un filtro hasta que Mireia haga uno dorado. */
  .dado { position: relative; width: clamp(190px, 52vw, 270px); aspect-ratio: 452 / 520; padding: 0; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  .dado:hover { transform: translateY(-3px); }
  .dado:disabled { cursor: default; transform: none; }
  .dado .d20 { display: block; width: 100%; height: 100%; pointer-events: none; filter: hue-rotate(-142deg) saturate(1.6) brightness(1.2) drop-shadow(0 0 16px rgba(201, 162, 75, .7)); }
  .dado #dadoCara { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%); width: 34%; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(#17121f 62%, #0b0810); border: 3px solid var(--oro); font-size: clamp(2.6rem, 12vw, 3.8rem); line-height: 1; }
  .dado #dadoCara:empty { display: none; }
  .dado #dadoCara img { height: 72%; width: auto; }
  .dado .play { position: absolute; right: -6px; bottom: 2%; width: clamp(60px, 16vw, 78px); aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: var(--rosa); color: #fff; font-size: clamp(1.7rem, 6vw, 2.3rem); padding-left: .12em; box-shadow: 0 0 0 4px var(--panel), 0 4px 12px rgba(0, 0, 0, .5); animation: latido 1s ease-in-out infinite; }
  .dado:disabled .play { display: none; }
  .ico-img { height: 1.35em; width: auto; vertical-align: -.3em; }
  .guia .ico .ico-img { height: 2.1rem; }
  @keyframes latido { 50% { transform: scale(1.18); } }  @keyframes latido { 50% { transform: scale(1.18); } }
  .dado.rueda { animation: bota .28s ease-in-out infinite; }
  .dado.cae { animation: cae .5s ease-out; }
  @keyframes bota { 0% { transform: rotate(-12deg) translateY(0); } 50% { transform: rotate(12deg) translateY(-14px); } 100% { transform: rotate(-12deg) translateY(0); } }
  @keyframes cae { 0% { transform: scale(1.35) rotate(18deg); } 60% { transform: scale(.95) rotate(-4deg); } 100% { transform: scale(1) rotate(0); } }
  .dado-texto { margin: 0; min-height: 3em; font-family: var(--fuente-nombres); font-size: 1.25rem; color: var(--oro-claro); }
  .dado-texto small { display: block; font-family: var(--fuente-texto); font-size: .9rem; color: var(--suave); margin-top: 2px; }

  /* ---------- tablero ---------- */
  .tablero { padding: 18px 16px 20px; border: 2px solid var(--linea); border-radius: 20px; background: var(--panel); }
  .tablero.sacude { animation: sacude .45s; }
  @keyframes sacude { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
  .cabeza { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .tema { font-family: var(--fuente-nombres); font-weight: 700; color: var(--oro-claro); }
  .tema .emo { font-size: 1.4rem; margin-right: 6px; }
  .mec { color: var(--suave); font-size: .9rem; }
  .pregunta { font-family: var(--fuente-nombres); font-weight: 700; font-size: clamp(1.15rem, 3.8vw, 1.5rem); line-height: 1.3; margin: 6px 0 16px; }
  .pregunta small { display: block; margin-top: 6px; font-family: var(--fuente-texto); font-weight: 400; font-size: .9rem; color: var(--suave); }
  .escena { display: grid; justify-items: center; gap: 14px; min-height: 220px; }
  .acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

  /* contador */
  /* atril de concurso: pulsador rojo arriba, pantalla con la cifra dentro de un marco con luces de la cinta */
  .atril { width: min(100%, 380px); }
  .pulsador { position: relative; z-index: 2; display: block; margin: 0 auto -30px; width: 140px; height: 76px; padding: 0; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  .pulsador .domo { position: absolute; left: 50%; bottom: 14px; width: 104px; height: 58px; transform: translateX(-50%); border-radius: 60px 60px 14px 14px / 56px 56px 14px 14px; background: radial-gradient(ellipse at 35% 22%, #ffb0ad 0 10%, #e0302b 42%, #8e0f0f 100%); box-shadow: 0 0 0 3px #3a0b0b, 0 6px 14px rgba(0, 0, 0, .6); transition: height .08s, transform .08s; }
  .pulsador .base { position: absolute; left: 50%; bottom: 0; width: 140px; height: 22px; transform: translateX(-50%); border-radius: 12px; background: linear-gradient(#8d8794, #3a3542); border: 2px solid #17121f; }
  .pulsador:disabled { cursor: default; }
  .pulsador:disabled .domo { filter: saturate(.25) brightness(.55); }
  .pulsador.listo .domo { animation: late .45s ease-in-out infinite alternate; }
  @keyframes late { to { box-shadow: 0 0 0 3px #3a0b0b, 0 0 26px 8px rgba(224, 48, 43, .65); } }
  .pulsador:not(:disabled):active .domo { height: 44px; transform: translateX(-50%) translateY(10px); }
  .atril-cuerpo { position: relative; aspect-ratio: 360 / 230; filter: drop-shadow(0 0 14px rgba(194, 56, 110, .35)); }
  .atril-marco { position: absolute; inset: 0; width: 100%; height: 100%; }
  .atril-pantalla { position: absolute; inset: 22% 14% 14%; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; align-items: center; text-align: center; }
  .atril-rotulo { margin: 0; font-family: var(--fuente-nombres); font-weight: 700; font-size: .8rem; letter-spacing: .16em; color: var(--suave); }
  .cifra { font-family: var(--fuente-titulos); font-weight: 900; font-size: clamp(3.4rem, 17vw, 5.4rem); line-height: 1; color: var(--oro-claro); font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(232, 206, 134, .45); }
  .cifra.parada { color: var(--bien); text-shadow: 0 0 18px rgba(63, 191, 122, .5); }
  .atril-pantalla .btn { min-height: 44px; padding: 6px 18px; }

  /* aguja: reloj ilustrado con la aguja encima; el botón STOP del dibujo hace de «Fijar» */
  .reloj-img { position: relative; width: min(100%, 520px); container-type: inline-size; }
  .reloj-fondo { display: block; width: 100%; height: auto; }
  .reloj-aguja { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .6)); }
  .reloj-lectura { position: absolute; left: 15%; top: 74.6%; width: 15.5%; height: 7%; display: grid; place-items: center; font-family: var(--fuente-titulos); font-weight: 900; font-size: 4.4cqw; color: var(--oro-claro); background: #0b0810; border-radius: 6px; text-shadow: 0 0 8px rgba(232, 206, 134, .5); }
  .reloj-stop { position: absolute; left: 70.7%; top: 25.3%; width: 17%; height: 27.8%; border: 0; border-radius: 50%; background: transparent; cursor: pointer; touch-action: manipulation; }
  .reloj-stop:hover { box-shadow: 0 0 0 4px rgba(232, 206, 134, .55); }
  .reloj-stop:active { background: rgba(255, 255, 255, .14); }
  .reloj-stop:disabled { cursor: default; box-shadow: none; }
  .pedales { position: relative; width: min(100%, 420px); }
  .pedales img { display: block; width: 100%; height: auto; pointer-events: none; user-select: none; -webkit-user-select: none; }
  .pedal { position: absolute; top: 0; bottom: 0; border: 0; background: transparent; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 14px; }
  .pedal-acel { left: 0; width: 52%; } .pedal-freno { left: 52%; right: 0; }
  .pedal-acel.activo { background: radial-gradient(circle at 59% 48%, rgba(63, 191, 122, .5), transparent 40%); }
  .pedal-freno.activo { background: radial-gradient(circle at 43% 49%, rgba(224, 82, 75, .55), transparent 40%); }

  /* deslizador (alternativa sin movimiento) */
  .desliza { display: grid; gap: 10px; width: min(100%, 420px); justify-items: center; }
  .desliza input[type=range] { width: 100%; height: 40px; accent-color: var(--oro); }
  .desliza output { font-family: var(--fuente-titulos); font-size: 2.6rem; color: var(--oro-claro); }

  /* pintar */
  .cuadro { display: grid; gap: 3px; width: min(100%, calc((100svh - 330px) / 1.45), 440px); min-width: 200px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34' viewBox='0 0 34 34'><path d='M29 4 L15 20' stroke='%23C9A24B' stroke-width='5' stroke-linecap='round'/><path d='M14 19 Q8 20 6 26 Q5 30 3 31 Q10 33 14 29 Q18 25 17 22 Z' fill='%23C2386E' stroke='%23F5F5F0' stroke-width='1.2'/></svg>") 4 30, crosshair; }
  .per { aspect-ratio: 3 / 4.2; border: 0; padding: 1px; background: transparent; color: #4a4258; cursor: inherit; border-radius: 6px; touch-action: none; }
  .per svg { width: 100%; height: 100%; fill: currentColor; display: block; }
  .per.on { color: var(--rosa); }
  .per.real { outline: 2px solid var(--oro-claro); outline-offset: -2px; }
  .per.real.on { color: var(--bien); }
  .per.sobra { color: var(--mal); }
  .cuenta { margin: 0; color: var(--suave); }

  /* cara a cara: cartas ilustradas (dorso y frente con hueco para el texto) */
  .cartas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: min(100%, 480px); perspective: 1000px; }
  .carta { position: relative; aspect-ratio: 538 / 800; padding: 0; border: 0; background: none; color: var(--blanco); font: inherit; cursor: pointer; container-type: inline-size; touch-action: manipulation; transition: transform .25s; }
  .carta:not(:disabled):hover { transform: translateY(-6px); }
  .carta .cara { position: absolute; inset: 0; display: grid; align-content: end; justify-items: center; gap: 2px; padding: 0 13% 17%; text-align: center; background-size: 100% 100%; background-repeat: no-repeat; backface-visibility: hidden; transition: transform .6s; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .6)); }
  .carta .tapa { background-image: url("img/opt/carta-dorso-2.webp"); }
  .carta .dentro { background-image: url("img/opt/carta-frente-texto.webp"); transform: rotateY(180deg); }
  .carta.vuelta .tapa { transform: rotateY(180deg); }
  .carta.vuelta .dentro { transform: rotateY(0); }
  .carta .etq-carta { font-family: var(--fuente-nombres); font-weight: 700; font-size: 9cqw; letter-spacing: .06em; color: var(--oro-claro); }
  .carta .dentro strong { font-family: var(--fuente-titulos); font-size: 10cqw; line-height: 1.1; color: var(--oro-claro); }
  .carta .dentro .etq-carta { font-size: 6.5cqw; color: var(--suave); }
  .carta.correcta .dentro { filter: drop-shadow(0 0 14px rgba(63, 191, 122, .95)); }
  .carta.fallo .dentro { filter: grayscale(.7) brightness(.75) drop-shadow(0 0 12px rgba(224, 82, 75, .7)); }
  .carta.elegida { transform: translateY(-6px) scale(1.03); }
  .carta:disabled { cursor: default; }

  /* resultado */
  /* al dar la respuesta, la escena se encoge y el resultado aparece en la misma pantalla (sin scroll) */
  .tablero.resuelto .escena { zoom: .6; min-height: 0; }
  .tablero.resuelto .escena .btn, .tablero.resuelto .acciones, .tablero.resuelto .pedales, .tablero.resuelto .cuenta { display: none; }
  .tablero.resuelto .resultado { margin-top: 10px; }
  .pregunta-sorpresa { margin: 10px 0 12px; font-style: italic; color: var(--oro-claro); }
  @media (min-width: 860px) {
    .tablero.resuelto { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; align-items: center; }
    .tablero.resuelto .cabeza, .tablero.resuelto .pregunta { grid-column: 1 / -1; }
    .tablero.resuelto .escena { zoom: .85; }
    .tablero.resuelto .resultado { margin-top: 0; }
  }
  .resultado { margin-top: 18px; padding: 16px; border-left: 6px solid var(--oro); border-radius: 0 14px 14px 0; background: #120d1a; }
  .resultado .real { font-family: var(--fuente-titulos); font-weight: 900; font-size: clamp(2rem, 9vw, 3rem); color: var(--oro-claro); line-height: 1.1; margin: 0; }
  .resultado .que { margin: 2px 0 10px; font-size: 1.05rem; }
  .resultado .tu { margin: 0 0 6px; color: var(--suave); }
  .veredicto { font-family: var(--fuente-nombres); font-weight: 700; font-size: 1.15rem; margin: 0 0 12px; }
  .veredicto.bien { color: var(--bien); } .veredicto.cerca { color: var(--oro-claro); } .veredicto.mal { color: var(--alerta); }
  .anio { color: var(--suave); font-size: .85rem; margin: 0 0 12px; }

  .final { max-width: 60ch; }
  .final .puntos { font-family: var(--fuente-titulos); font-size: 2.2rem; color: var(--oro-claro); margin: 0 0 8px; }
  .final details { margin: 18px 0; color: var(--suave); font-size: .9rem; }
  .final summary { cursor: pointer; color: var(--oro-claro); }
  .final ul { padding-left: 1.2em; margin: 8px 0; } .final li { margin: 4px 0; }

  .confeti { position: fixed; top: -14px; width: 10px; height: 16px; z-index: 50; pointer-events: none; animation: cae-conf 1.8s ease-in forwards; }
  @keyframes cae-conf { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }

  footer { margin-top: auto; background: #000; border-top: 10px solid transparent; border-image: var(--cinta-colores) 10; }
  footer .envoltorio { padding: 20px 0 26px; }
  .firma { margin: 0; font-family: var(--fuente-titulos); font-weight: 700; font-size: 1.05rem; color: var(--oro-claro); }
  .fuente-pie { margin: 10px 0 0; font-size: .8rem; color: var(--suave); }

  @media (prefers-reduced-motion: reduce) {
    .dado.rueda, .dado.cae, .dado .play, .pulsador.listo .domo, .tablero.sacude, .confeti { animation: none; }
    .carta .cara, .carta, .barra i { transition: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="persona" viewBox="0 0 24 40"><circle cx="12" cy="7" r="6"/><path d="M4 17c0-2.5 1.8-4 4-4h8c2.2 0 4 1.5 4 4v11h-3.5v11h-9V28H4z"/></symbol></svg>
<header class="cab"><div class="envoltorio">
  <a class="logo" href="propuesta-d-mezcla.html">♀ Feminist</a>
  <h1 id="titulo"></h1>
  <p class="sub" id="subtitulo"></p>
  <p class="aviso-boceto" id="avisoBoceto"></p>
</div></header>

<main class="envoltorio">
  <section class="pantalla" id="pIntro" aria-labelledby="hIntro">
    <h2 id="hIntro"></h2>
    <div class="caja-mensaje" id="introTxt"></div>
    <ul class="guia" id="guia"></ul>
    <button class="btn primario grande" id="btnEmpezar" type="button"></button>
  </section>

  <section class="pantalla" id="pJuego" hidden aria-label="Partida">
    <div class="marcador"><span class="etq" id="mRonda"></span><span class="etq" id="mPuntos"></span></div>
    <div class="barra" aria-hidden="true"><i id="barraProg"></i></div>
    <div class="dado-caja" id="dadoCaja">
      <button class="dado" id="btnDado" type="button" aria-label="Tirar el dado"><img class="d20" src="img/opt/dado-d20.webp" alt="" width="452" height="520"><span id="dadoCara" aria-hidden="true"></span><span class="play" aria-hidden="true">▶</span></button>
      <p class="dado-texto" id="dadoTxt" aria-live="polite"></p>
    </div>
    <div class="tablero" id="tablero" hidden>
      <div class="cabeza"><span class="tema" id="tTema"></span><span class="mec" id="tMec"></span></div>
      <p class="pregunta" id="tPregunta"></p>
      <div class="escena" id="escena"></div>
      <div class="resultado" id="resultado" hidden aria-live="polite"></div>
    </div>
  </section>

  <section class="pantalla" id="pFinal" hidden aria-labelledby="hFinal">
    <div class="final">
      <h2 id="hFinal"></h2>
      <p class="puntos" id="fPuntos"></p>
      <p id="fMensaje"></p>
      <details id="fFuentes"><summary></summary><ul id="fLista"></ul></details>
      <button class="btn primario" id="btnOtra" type="button"></button>
    </div>
  </section>
</main>

<footer><div class="envoltorio">
  <p class="firma">Diseñada, programada y probada por Mireia Gutiérrez</p>
  <p class="fuente-pie" id="fuentePie"></p>
</div></footer>

<script>
(function () {
  /* ---------- Textos de interfaz (irán a los archivos de idioma es / ca / en) ---------- */
  var TXT = {
    titulo: 'Adivina el porcentaje',
    subtitulo: 'Datos reales sobre las mujeres y los hombres. ¿Cuánto crees que es? Tira el dado y descubre cómo te toca responder.',
    aviso: 'Boceto: mecánicas y diseño provisionales y sin sonido. Los datos son reales (infografías «Mujeres en cifras»); algunos años están por confirmar. Cada partida elige 7 datos y 3 parejas al azar.',
    hIntro: 'Cómo se juega',
    intro: ['Cada ronda sale una pregunta con un dato real.', 'Antes de responder tiras el dado, y el dado decide <b>cómo</b> tienes que contestar. Al final de cada ronda ves la cifra de verdad.', 'A ver si estás en lo cierto: cuanto más cerca, más puntos.'],
    empezar: 'Empezar',
    ronda: function (a, b) { return 'Ronda ' + a + ' de ' + b; },
    puntos: function (p) { return p + ' puntos'; },
    tocaDado: 'Toca el dado para tirarlo',
    teToca: 'Te toca:', sigue: 'Sigue la pareja de datos',
    siguiente: 'Siguiente', verFinal: 'Ver el resultado',
    real: 'Dato real', tuRespuesta: function (t) { return 'Tu respuesta: ' + t; },
    cercaDe: function (n) { return n === 0 ? 'exacto' : 'a ' + fmtN(n) + ' puntos porcentuales'; },
    veredictos: { clavado: '¡Clavado!', casi: '¡Casi!', cerca: 'Cerca', lejos: 'Lejos' },
    acierto: '¡Acertaste!', fallo: 'No era esa', sorpresa: '¿Te ha sorprendido el resultado?', eraAsi: function (t) { return 'Era: ' + t; },
    anioDatos: function (a) { return 'Datos de ' + a; },
    mecanicas: {
      contador: { ico: '⏱️', nombre: 'El contador loco', desc: 'La cifra sube sin parar: pulsa PARAR en el número que creas.' },
      aguja: { ico: '🧭', nombre: 'El cuentakilómetros', desc: 'Acelera, frena y fija la aguja en la cifra.' },
      pintar: { ico: '👥', nombre: 'Pinta a la gente', desc: 'Toca (o arrastra sobre) las personas que crees que cumplen el dato.' },
      caraacara: { ico: '🃏', nombre: 'Cara a cara', desc: 'Dos cartas boca abajo: toca la que crees.' }
    },
    tuRespuestaRotulo: 'TU RESPUESTA', jugar: '▶ Play', parar: '✋ ¡PARAR!', acelerar: 'Acelerar', frenar: 'Frenar', fijar: 'Fijar aquí (botón STOP)', comprobar: 'Comprobar', borrar: 'Borrar todo',
    pintados: function (n, de) { return 'Has pintado ' + n + ' de ' + de; },
    pintaAyuda: function (de) { return de + ' personas. Pinta las que cumplen el dato.'; },
    carta: 'Toca para elegir',
    fin: '¡Partida terminada!',
    finMsgs: ['¡Tienes mucho ojo!', 'Nada mal. A ver si la próxima te acercas aún más.', 'Estos datos no son fáciles de adivinar. ¿Te han sorprendido?'],
    otra: 'Jugar otra vez',
    fuentesResumen: 'Infografías de las que salen los datos de esta partida',
    fuentePie: 'Actividad «Adivina el porcentaje»: datos extraídos de Instituto de las Mujeres (Gobierno de España), «Mujeres en cifras».'
  };
  var TAM = { datos: 7, parejas: 3 };
  var CLAVES = ['contador', 'aguja', 'pintar', 'caraacara'];
  var ICO_IMG = { pintar: 'img/opt/logo-pintar.webp' }; // logo ilustrado de «Pinta a la gente»; los demás, de momento, emoticonos
  function icoHtml(k) { return ICO_IMG[k] ? '<img class="ico-img" src="' + ICO_IMG[k] + '" alt="">' : TXT.mecanicas[k].ico; }
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var D = null, seq = [], pos = 0, puntos = 0, usos = {}, parar = null, infoUsadas = {};
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function L(o) { return (o && o.es) || o || ''; } // por ahora solo es; ca/en están pendientes de traducir
  function fmtN(v) { return new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2, useGrouping: 'always' }).format(v); }
  function fmt(v, uni) { if (v == null) return '—'; return uni === '%' ? fmtN(v) + ' %' : fmtN(v) + ' ' + uni; }
  function mezclar(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- Textos fijos ---------- */
  $('titulo').textContent = TXT.titulo; $('subtitulo').textContent = TXT.subtitulo; $('avisoBoceto').textContent = TXT.aviso;
  $('hIntro').textContent = TXT.hIntro; $('btnEmpezar').textContent = TXT.empezar; $('btnOtra').textContent = TXT.otra;
  $('fuentePie').textContent = TXT.fuentePie; $('hFinal').textContent = TXT.fin; $('fFuentes').querySelector('summary').textContent = TXT.fuentesResumen;
  TXT.intro.forEach(function (t, i) { var p = el('p', i === 0 ? 'grande' : ''); p.innerHTML = t; $('introTxt').appendChild(p); });
  ['contador', 'aguja', 'pintar', 'caraacara'].forEach(function (k) {
    var m = TXT.mecanicas[k], li = el('li'), ic = el('span', 'ico'); ic.innerHTML = icoHtml(k); li.appendChild(ic); li.appendChild(el('strong', '', m.nombre)); li.appendChild(el('small', '', m.desc)); $('guia').appendChild(li);
  });

  /* ---------- Carga de datos ---------- */
  fetch('data/porcentajes.json').then(function (r) { return r.json(); }).then(function (j) { D = j; })
    .catch(function () { $('introTxt').appendChild(el('p', '', 'No se han podido cargar los datos (abre esta página desde un servidor local).')); });

  /* ---------- Partida ---------- */
  function armarPartida() {
    var ds = mezclar(D.datos).slice(0, TAM.datos), ps = mezclar(D.parejas).slice(0, TAM.parejas), s = [], di = 0, pi = 0;
    while (di < ds.length || pi < ps.length) { // dos datos, una pareja, dos datos…: así el cara a cara no se amontona
      for (var k = 0; k < 2 && di < ds.length; k++) s.push({ tipo: 'dato', it: ds[di++] });
      if (pi < ps.length) { var p = ps[pi++]; p.rondas.forEach(function (r, idx) { s.push({ tipo: 'pareja', it: p, ronda: r, idx: idx }); }); }
    }
    return s;
  }
  function elegirMecanica(it) { // dado trucado: la que menos ha salido hasta ahora; si empatan, al azar
    var c = it.mecanicas.slice(), min = Math.min.apply(null, c.map(function (m) { return usos[m] || 0; }));
    c = c.filter(function (m) { return (usos[m] || 0) === min; });
    return c[Math.floor(Math.random() * c.length)];
  }
  $('btnEmpezar').addEventListener('click', function () {
    if (!D) return;
    seq = armarPartida(); pos = 0; puntos = 0; usos = { contador: 0, aguja: 0, pintar: 0, caraacara: 0 }; infoUsadas = {};
    $('pIntro').hidden = true; $('pFinal').hidden = true; $('pJuego').hidden = false; turno();
  });
  $('btnOtra').addEventListener('click', function () { $('pFinal').hidden = true; $('pIntro').hidden = false; window.scrollTo(0, 0); });

  function marcador() {
    $('mRonda').textContent = TXT.ronda(pos + 1, seq.length); $('mPuntos').textContent = TXT.puntos(puntos);
    $('barraProg').style.width = (pos / seq.length * 100) + '%';
  }
  function turno() {
    parar && parar(); parar = null;
    var t = seq[pos]; marcador();
    $('tablero').hidden = true; $('resultado').hidden = true; $('escena').textContent = '';
    infoUsadas[t.it.infografia] = true;
    var mec = t.tipo === 'dato' ? elegirMecanica(t.it) : 'caraacara';
    t.mec = mec;
    if (t.tipo === 'pareja' && t.idx > 0) { $('dadoCaja').hidden = true; mostrarTablero(t); return; } // 2.ª ronda de una pareja: sin dado
    $('dadoCaja').hidden = false; $('dadoCara').textContent = ''; $('btnDado').className = 'dado'; $('dadoTxt').textContent = TXT.tocaDado; $('btnDado').disabled = false;
    $('btnDado').focus({ preventScroll: true });
  }
  $('btnDado').addEventListener('click', function () {
    var t = seq[pos], mec = t.mec, dado = $('btnDado'), cara = $('dadoCara');
    dado.disabled = true; usos[mec] = (usos[mec] || 0) + 1;
    var m = TXT.mecanicas[mec];
    function cae() {
      dado.className = 'dado cae'; cara.innerHTML = icoHtml(mec);
      var tx = $('dadoTxt'); tx.textContent = TXT.teToca + ' ' + m.nombre; tx.appendChild(el('small', '', m.desc));
      setTimeout(function () { $('dadoCaja').hidden = true; mostrarTablero(t); }, reduce ? 500 : 1300);
    }
    if (reduce) { cae(); return; }
    dado.className = 'dado rueda'; var i = 0, iv = setInterval(function () { cara.innerHTML = icoHtml(CLAVES[i++ % 4]); }, 85);
    setTimeout(function () { clearInterval(iv); cae(); }, 1200);
  });

  function mostrarTablero(t) {
    var tema = D.temas[t.it.tema], m = TXT.mecanicas[t.mec];
    $('tTema').innerHTML = ''; $('tTema').appendChild(el('span', 'emo', tema.emoji)); $('tTema').appendChild(document.createTextNode(L(tema)));
    $('tMec').innerHTML = icoHtml(t.mec) + ' ' + m.nombre;
    // si el dato es «X de cada 10» y la mecánica mide en %, se usa la pregunta reformulada en porcentaje (preguntaPct)
    $('tPregunta').textContent = L(t.tipo === 'dato' ? (t.mec !== 'pintar' && t.it.preguntaPct ? t.it.preguntaPct : t.it.pregunta) : t.ronda.pregunta);
    $('escena').textContent = ''; $('resultado').hidden = true; $('tablero').className = 'tablero'; $('tablero').hidden = false;
    var esc = $('escena');
    if (t.mec === 'contador') (reduce ? escenaDeslizador : escenaContador)(t, esc);
    else if (t.mec === 'aguja') (reduce ? escenaDeslizador : escenaAguja)(t, esc);
    else if (t.mec === 'pintar') escenaPintar(t, esc);
    else escenaCartas(t, esc);
    $('tablero').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }

  /* ---------- Resultado ---------- */
  function veredicto(dif) { return dif <= 1 ? ['clavado', 'bien'] : dif <= 5 ? ['casi', 'bien'] : dif <= 15 ? ['cerca', 'cerca'] : ['lejos', 'mal']; }
  function cerrarRonda(ptos, htmlPanel, dif) {
    puntos += ptos; $('mPuntos').textContent = TXT.puntos(puntos);
    var r = $('resultado'); r.textContent = ''; r.appendChild(htmlPanel);
    var ultimo = pos === seq.length - 1, b = el('button', 'btn primario', ultimo ? TXT.verFinal : TXT.siguiente); b.type = 'button';
    b.addEventListener('click', function () { pos++; if (pos >= seq.length) final(); else turno(); });
    r.appendChild(b); r.hidden = false; $('barraProg').style.width = ((pos + 1) / seq.length * 100) + '%';
    $('tablero').classList.add('resuelto'); // la escena se encoge y todo cabe en la misma pantalla
    if (ptos >= 90) confeti(); else if (dif > 25) { $('tablero').classList.add('sacude'); }
    $('tablero').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); b.focus({ preventScroll: true });
  }
  function resolverNumerico(t, guess, de, tuTxt) { // guess y de: en la escala de la mecánica; se pasa todo a puntos porcentuales
    var it = t.it, realPct = de === 100 || !it.fraccion ? it.valor : it.fraccion.n / de * 100;
    var dif = Math.abs((de === 100 ? guess : guess / de * 100) - realPct);
    var v = veredicto(dif), ptos = Math.max(0, Math.round(100 - dif * 2.5)), p = el('div');
    p.appendChild(el('p', 'real', fmt(it.valor, '%')));
    p.appendChild(el('p', 'que', L(it.etiqueta)));
    p.appendChild(el('p', 'tu', TXT.tuRespuesta(tuTxt) + ' (' + TXT.cercaDe(Math.round(dif * 10) / 10) + ')'));
    p.appendChild(el('p', 'veredicto ' + v[1], TXT.veredictos[v[0]] + ' · +' + ptos));
    p.appendChild(el('p', 'pregunta-sorpresa', TXT.sorpresa));
    if (it.anioDatos) p.appendChild(el('p', 'anio', TXT.anioDatos(it.anioDatos)));
    cerrarRonda(ptos, p, dif);
  }

  /* ---------- Mecánica 1: contador loco (atril de concurso con pulsador) ---------- */
  function escenaContador(t, esc) {
    var v = 0, iv = null, hecho = false, atril = el('div', 'atril');
    var pul = el('button', 'pulsador'); pul.type = 'button'; pul.disabled = true; pul.setAttribute('aria-label', TXT.parar); pul.innerHTML = '<span class="domo"></span><span class="base"></span>';
    var cuerpo = el('div', 'atril-cuerpo');
    cuerpo.innerHTML = '<svg class="atril-marco" viewBox="0 0 360 230" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gAtril" x1="0" x2="1"><stop offset="0" stop-color="#C2386E"/><stop offset=".33" stop-color="#127C86"/><stop offset=".66" stop-color="#E8762B"/><stop offset="1" stop-color="#6B2D8C"/></linearGradient></defs>'
      + '<path vector-effect="non-scaling-stroke" d="M40 8 H320 Q336 8 340 22 L352 200 Q354 222 332 222 H28 Q6 222 8 200 L20 22 Q24 8 40 8 Z" fill="#0d0a14" stroke="url(#gAtril)" stroke-width="6"/>'
      + '<path vector-effect="non-scaling-stroke" d="M52 30 H308 L316 188 H44 Z" fill="none" stroke="#C9A24B" stroke-width="2"/></svg>';
    var pan = el('div', 'atril-pantalla'), cif = el('div', 'cifra', '0'), play = el('button', 'btn primario', TXT.jugar); play.type = 'button';
    cif.setAttribute('role', 'img'); cif.setAttribute('aria-label', 'Contador');
    pan.appendChild(el('p', 'atril-rotulo', TXT.tuRespuestaRotulo)); pan.appendChild(cif); pan.appendChild(play);
    cuerpo.appendChild(pan); atril.appendChild(pul); atril.appendChild(cuerpo); esc.appendChild(atril);
    parar = function () { clearInterval(iv); };
    function stop() { // el pulsador para la cifra
      if (hecho || !iv) return; hecho = true; clearInterval(iv); pul.disabled = true; pul.classList.remove('listo'); cif.classList.add('parada');
      resolverNumerico(t, v, 100, v + ' %');
    }
    play.addEventListener('click', function () { // «Play»: la cifra sube muy rápido y vuelve a 0 al llegar a 100
      if (iv) return; play.hidden = true; pul.disabled = false; pul.classList.add('listo');
      iv = setInterval(function () { v = (v + 1) % 101; cif.textContent = v; }, 26); pul.focus({ preventScroll: true });
    });
    pul.addEventListener('pointerdown', function (e) { e.preventDefault(); stop(); }); // responde al tocar, sin esperar a soltar
    pul.addEventListener('click', function (e) { if (e.detail === 0) stop(); }); // teclado
    play.focus({ preventScroll: true });
  }

  /* ---------- Mecánica 2: cuentakilómetros (reloj ilustrado, aguja con inercia) ---------- */
  // ángulo de la aguja (grados desde arriba, en sentido horario) que coincide con los números pintados en el reloj; medidos a mano sobre la imagen
  var ESCALA = [[0, -146], [10, -117], [20, -87.8], [30, -58.5], [40, -31.8], [50, -0.9], [60, 27.4], [70, 54.8], [80, 84.2], [100, 110.8]];
  function anguloAguja(v) {
    for (var i = 1; i < ESCALA.length; i++) if (v <= ESCALA[i][0]) { var a = ESCALA[i - 1], b = ESCALA[i]; return a[1] + (b[1] - a[1]) * (v - a[0]) / (b[0] - a[0]); }
    return ESCALA[ESCALA.length - 1][1];
  }
  function escenaAguja(t, esc) {
    var reloj = el('div', 'reloj-img');
    reloj.innerHTML = '<img class="reloj-fondo" src="img/opt/reloj.webp" alt="" width="1000" height="612">'
      + '<svg class="reloj-aguja" viewBox="0 0 1000 612" aria-hidden="true"><g class="ag"><polygon points="222,100 212,236 232,236" fill="#E8CE86" stroke="#17121f" stroke-width="4" stroke-linejoin="round"/><circle cx="222" cy="230" r="15" fill="#C9A24B" stroke="#17121f" stroke-width="4"/></g></svg>';
    var ag = reloj.querySelector('.ag'), lec = el('div', 'reloj-lectura', '0 %'), fij = el('button', 'reloj-stop'); fij.type = 'button'; fij.setAttribute('aria-label', TXT.fijar);
    reloj.appendChild(lec); reloj.appendChild(fij); esc.appendChild(reloj);
    var ped = el('div', 'pedales'); ped.innerHTML = '<img src="img/opt/botones-acelerar-frenar.webp" alt="" width="900" height="499">';
    var acel = el('button', 'pedal pedal-acel'), fren = el('button', 'pedal pedal-freno'); acel.type = fren.type = 'button'; acel.setAttribute('aria-label', TXT.acelerar); fren.setAttribute('aria-label', TXT.frenar);
    ped.appendChild(acel); ped.appendChild(fren); esc.appendChild(ped);
    var val = 0, vel = 0, dA = false, dF = false, raf = 0, ult = 0, hecho = false;
    function pinta() { ag.setAttribute('transform', 'rotate(' + anguloAguja(val) + ' 222 230)'); lec.textContent = Math.round(val) + ' %'; }
    function frame(ts) { // física sencilla: acelerar empuja, soltar deja caer la aguja y frenar la clava
      var dt = Math.min(.05, (ts - ult) / 1000 || 0); ult = ts;
      if (dF) vel *= Math.exp(-9 * dt); else vel += (dA ? 75 : -45) * dt;
      vel = Math.max(-50, Math.min(70, vel)); val += vel * dt;
      if (val >= 100) { val = 100; vel = 0; } if (val <= 0) { val = 0; vel = Math.max(0, vel); }
      pinta(); raf = requestAnimationFrame(frame);
    }
    function pedal(b, set) {
      function on(e) { set(true); b.classList.add('activo'); if (e && e.pointerId != null && b.setPointerCapture) { try { b.setPointerCapture(e.pointerId); } catch (x) { /* sin captura */ } } }
      function off() { set(false); b.classList.remove('activo'); }
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); on(e); });
      ['pointerup', 'pointercancel', 'lostpointercapture', 'blur'].forEach(function (ev) { b.addEventListener(ev, off); });
      b.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); on(); } });
      b.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') off(); });
    }
    pedal(acel, function (x) { dA = x; }); pedal(fren, function (x) { dF = x; });
    parar = function () { cancelAnimationFrame(raf); };
    fij.addEventListener('click', function () { if (hecho) return; hecho = true; cancelAnimationFrame(raf); fij.disabled = acel.disabled = fren.disabled = true; var g = Math.round(val); resolverNumerico(t, g, 100, g + ' %'); });
    pinta(); raf = requestAnimationFrame(function (ts) { ult = ts; frame(ts); });
  }

  /* ---------- Alternativa sin movimiento (prefers-reduced-motion): deslizador ---------- */
  function escenaDeslizador(t, esc) {
    var c = el('div', 'desliza'), r = document.createElement('input'), o = el('output', '', '50 %'), b = el('button', 'btn primario grande', TXT.comprobar); b.type = 'button';
    r.type = 'range'; r.min = 0; r.max = 100; r.value = 50; r.setAttribute('aria-label', 'Porcentaje');
    r.addEventListener('input', function () { o.textContent = r.value + ' %'; });
    b.addEventListener('click', function () { b.disabled = true; r.disabled = true; resolverNumerico(t, +r.value, 100, r.value + ' %'); });
    c.appendChild(o); c.appendChild(r); c.appendChild(b); esc.appendChild(c);
  }

  /* ---------- Mecánica 3: pintar a la gente ---------- */
  function escenaPintar(t, esc) {
    var it = t.it, de = it.fraccion && it.fraccion.de <= 100 ? it.fraccion.de : 100, real = it.fraccion && it.fraccion.de <= 100 ? it.fraccion.n : Math.round(it.valor);
    var cols = de === 35 ? 7 : de <= 10 ? 5 : 10, cuadro = el('div', 'cuadro'), celdas = [], modo = null, n = 0, cuenta = el('p', 'cuenta'), hecho = false;
    cuadro.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    for (var i = 0; i < de; i++) {
      var b = el('button', 'per'); b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', 'Persona ' + (i + 1));
      b.innerHTML = '<svg viewBox="0 0 24 40" aria-hidden="true"><use href="#persona"/></svg>'; cuadro.appendChild(b); celdas.push(b);
    }
    function pon(b, on) { if (hecho || b.classList.contains('on') === on) return; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); n += on ? 1 : -1; cuenta.textContent = TXT.pintados(n, de); }
    cuadro.addEventListener('pointerdown', function (e) { var b = e.target.closest('.per'); if (!b) return; e.preventDefault(); modo = !b.classList.contains('on'); pon(b, modo); });
    cuadro.addEventListener('pointermove', function (e) { if (modo === null) return; var x = document.elementFromPoint(e.clientX, e.clientY); x = x && x.closest && x.closest('.per'); if (x && cuadro.contains(x)) pon(x, modo); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cuadro.addEventListener(ev, function () { modo = null; }); });
    cuadro.addEventListener('click', function (e) { if (e.detail === 0) { var b = e.target.closest('.per'); if (b) pon(b, !b.classList.contains('on')); } }); // teclado
    var ac = el('div', 'acciones'), ok = el('button', 'btn primario grande', TXT.comprobar), bo = el('button', 'btn', TXT.borrar); ok.type = bo.type = 'button';
    bo.addEventListener('click', function () { celdas.forEach(function (c) { pon(c, false); }); });
    ok.addEventListener('click', function () {
      if (hecho) return; var pintadas = n; hecho = true; ok.disabled = bo.disabled = true;
      celdas.forEach(function (c, i) { if (i < real) c.classList.add('real'); else if (c.classList.contains('on')) c.classList.add('sobra'); });
      resolverNumerico(t, pintadas, de, pintadas + ' de ' + de);
    });
    cuenta.textContent = TXT.pintaAyuda(de); esc.appendChild(cuenta); esc.appendChild(cuadro); ac.appendChild(ok); ac.appendChild(bo); esc.appendChild(ac);
  }

  /* ---------- Mecánica 4: cara a cara (cartas ilustradas) ---------- */
  function escenaCartas(t, esc) {
    var r = t.ronda, cont = el('div', 'cartas'), hecho = false, cartas = [];
    r.opciones.forEach(function (o, i) {
      var c = el('button', 'carta'); c.type = 'button'; c.setAttribute('aria-label', TXT.carta + ': ' + L(o.etiqueta));
      var tapa = el('span', 'cara tapa'); tapa.appendChild(el('span', 'etq-carta', L(o.etiqueta)));
      var den = el('span', 'cara dentro'); den.appendChild(el('strong', '', o.valor != null ? fmt(o.valor, o.unidad) : (o.texto || '—'))); den.appendChild(el('span', 'etq-carta', L(o.etiqueta)));
      c.appendChild(tapa); c.appendChild(den); cont.appendChild(c); cartas.push(c);
      c.addEventListener('click', function () {
        if (hecho) return; hecho = true;
